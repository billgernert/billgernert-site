<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Concrete drill-down paths</title>
  <desc id="desc">The Kubernetes, infrastructure, delivery, and certificate branches follow different ownership paths.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#00ff96" stroke-width="1.5"/></marker>
    <style>.bg{fill:#08111f}.box{fill:#0d1d31;stroke:#2c5373;stroke-width:2}.root{fill:#08243a;stroke:#00d4ff;stroke-width:2}.wire{fill:none;stroke:#00ff96;stroke-width:2.5;marker-end:url(#arrow)}.title{fill:#e8f3ff;font:600 24px 'Exo 2',sans-serif}.head{fill:#e8f3ff;font:600 15px 'Exo 2',sans-serif}.tag{fill:#00d4ff;font:11px 'Share Tech Mono',monospace;letter-spacing:1px}</style>
  </defs>
  <rect class="bg" width="1200" height="590" rx="14"/>
  <text class="title" x="42" y="48">Concrete drill-down paths</text>
  <path class="wire" d="M200 140 H250"/><path class="wire" d="M420 140 H470"/><path class="wire" d="M640 140 H690"/><path class="wire" d="M860 140 H910"/><path class="wire" d="M1080 140 H1120"/>
  <path class="wire" d="M200 265 H310"/><path class="wire" d="M500 265 H610"/><path class="wire" d="M800 265 H910"/>
  <path class="wire" d="M200 390 H400"/><path class="wire" d="M590 390 H790"/>
  <path class="wire" d="M200 515 H400"/><path class="wire" d="M590 515 H790"/>
  <text class="tag" x="40" y="99">KUBERNETES</text>
  <rect class="root" x="40" y="110" width="160" height="60" rx="8"/><text class="head" x="120" y="146" text-anchor="middle">Namespace</text>
  <rect class="box" x="250" y="110" width="170" height="60" rx="8"/><text class="head" x="335" y="146" text-anchor="middle">Workload</text>
  <rect class="box" x="470" y="110" width="170" height="60" rx="8"/><text class="head" x="555" y="146" text-anchor="middle">ReplicaSet</text>
  <rect class="box" x="690" y="110" width="170" height="60" rx="8"/><text class="head" x="775" y="146" text-anchor="middle">Pod</text>
  <rect class="box" x="910" y="110" width="170" height="60" rx="8"/><text class="head" x="995" y="146" text-anchor="middle">Container</text>
  <rect class="box" x="1120" y="110" width="55" height="60" rx="8"/><text class="head" x="1148" y="146" text-anchor="middle">Leaf</text>
  <text class="tag" x="40" y="224">INFRASTRUCTURE</text>
  <rect class="root" x="40" y="235" width="160" height="60" rx="8"/><text class="head" x="120" y="271" text-anchor="middle">Hypervisors</text>
  <rect class="box" x="310" y="235" width="190" height="60" rx="8"/><text class="head" x="405" y="271" text-anchor="middle">Proxmox host</text>
  <rect class="box" x="610" y="235" width="190" height="60" rx="8"/><text class="head" x="705" y="271" text-anchor="middle">Virtual machine</text>
  <rect class="box" x="910" y="235" width="190" height="60" rx="8"/><text class="head" x="1005" y="271" text-anchor="middle">Resource evidence</text>
  <text class="tag" x="40" y="349">DELIVERY</text>
  <rect class="root" x="40" y="360" width="160" height="60" rx="8"/><text class="head" x="120" y="396" text-anchor="middle">Pipeline groups</text>
  <rect class="box" x="400" y="360" width="190" height="60" rx="8"/><text class="head" x="495" y="396" text-anchor="middle">Job category</text>
  <rect class="box" x="790" y="360" width="190" height="60" rx="8"/><text class="head" x="885" y="396" text-anchor="middle">Jenkins job</text>
  <text class="tag" x="40" y="474">CERTIFICATES</text>
  <rect class="root" x="40" y="485" width="160" height="60" rx="8"/><text class="head" x="120" y="521" text-anchor="middle">Certificate groups</text>
  <rect class="box" x="400" y="485" width="190" height="60" rx="8"/><text class="head" x="495" y="521" text-anchor="middle">Trust boundary</text>
  <rect class="box" x="790" y="485" width="190" height="60" rx="8"/><text class="head" x="885" y="521" text-anchor="middle">Observed endpoint</text>
</svg>
