<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 500" role="img" aria-labelledby="title desc">
  <title id="title">Where the platform map runs</title>
  <desc id="desc">Prometheus, a topology server pod, and a publisher pod run in the K3s monitoring namespace. The publisher writes outward to a Cloudflare Durable Object that the public browser reads.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#00ff96" stroke-width="1.5"/></marker>
    <style>.bg{fill:#08111f}.zone{fill:#0a1728;stroke:#25405d;stroke-width:2}.box{fill:#0d1d31;stroke:#2c5373;stroke-width:2}.core{fill:#08243a;stroke:#00d4ff;stroke-width:2}.wire{fill:none;stroke:#00ff96;stroke-width:3;marker-end:url(#arrow)}.title{fill:#e8f3ff;font:600 24px 'Exo 2',sans-serif}.head{fill:#e8f3ff;font:600 17px 'Exo 2',sans-serif}.copy{fill:#91a8bc;font:13px 'Share Tech Mono',monospace}.tag{fill:#00d4ff;font:11px 'Share Tech Mono',monospace;letter-spacing:1px}</style>
  </defs>
  <rect class="bg" width="1240" height="500" rx="14"/>
  <text class="title" x="42" y="48">Where the platform map runs</text>
  <rect class="zone" x="25" y="78" width="875" height="350" rx="14"/>
  <text class="tag" x="50" y="108">K3S · MONITORING NAMESPACE</text>
  <rect class="box" x="60" y="185" width="210" height="130" rx="10"/>
  <rect class="core" x="330" y="170" width="290" height="160" rx="10"/>
  <rect class="core" x="680" y="185" width="200" height="130" rx="10"/>
  <rect class="box" x="940" y="125" width="270" height="120" rx="10"/>
  <rect class="box" x="940" y="330" width="270" height="110" rx="10"/>
  <path class="wire" d="M270 250 H330"/>
  <path class="wire" d="M620 250 H680"/>
  <path class="wire" d="M880 250 H940"/>
  <path class="wire" d="M1075 245 V330"/>
  <text class="tag" x="165" y="217" text-anchor="middle">EXISTING SERVICE</text><text class="head" x="165" y="250" text-anchor="middle">Prometheus API</text><text class="copy" x="165" y="276" text-anchor="middle">metrics read only</text>
  <text class="tag" x="475" y="202" text-anchor="middle">DEPLOYMENT · 1 POD</text><text class="head" x="475" y="235" text-anchor="middle">Python topology server</text><text class="copy" x="475" y="263" text-anchor="middle">port 8080 · 15 s cache</text><text class="copy" x="475" y="287" text-anchor="middle">no service-account token</text>
  <text class="tag" x="780" y="217" text-anchor="middle">DEPLOYMENT · 1 POD</text><text class="head" x="780" y="250" text-anchor="middle">Public publisher</text><text class="copy" x="780" y="276" text-anchor="middle">outbound every 15 s</text>
  <text class="tag" x="1075" y="157" text-anchor="middle">CLOUDFLARE</text><text class="head" x="1075" y="188" text-anchor="middle">Worker + Durable Object</text><text class="copy" x="1075" y="214" text-anchor="middle">accepted public JSON</text>
  <text class="tag" x="1075" y="361" text-anchor="middle">PUBLIC SITE</text><text class="head" x="1075" y="392" text-anchor="middle">Browser renderer</text><text class="copy" x="1075" y="418" text-anchor="middle">read only</text>
</svg>
