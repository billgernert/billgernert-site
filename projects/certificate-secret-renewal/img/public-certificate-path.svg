<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc">
  <title id="title">Public certificate renewal and deployment path</title>
  <desc id="desc">Let’s Encrypt validates a Cloudflare DNS challenge, cert-manager writes one source Secret, Jenkins deploys the certificate to Kubernetes, hosts, and appliances, and blackbox exporter verifies it from the wire.</desc>
  <defs>
    <style>
      .bg{fill:#090e18}.zone{fill:#0e1522;stroke:#24324a;stroke-width:2}.box{fill:#131d2d;stroke:#00d4ff;stroke-width:2}.verify{fill:#10231f;stroke:#00ff96;stroke-width:2}.label{fill:#eef4fb;font:600 20px Arial,sans-serif}.small{fill:#aebbd0;font:16px Arial,sans-serif}.zoneTitle{fill:#00d4ff;font:700 15px Arial,sans-serif;letter-spacing:1.5px}.diagramTitle{fill:#eef4fb;font:700 28px Arial,sans-serif}.arrow{fill:none;stroke:#00d4ff;stroke-width:3;marker-end:url(#head)}.green{stroke:#00ff96;marker-end:url(#headGreen)}.lane{fill:#0b111d;stroke:#31415d;stroke-width:1}.laneText{fill:#aebbd0;font:15px Arial,sans-serif}.footerText{fill:#d8e2ee;font:16px Arial,sans-serif}.legendText{fill:#aebbd0;font:14px Arial,sans-serif}.num{fill:#090e18;stroke:#00d4ff;stroke-width:2}.numText{fill:#00d4ff;font:700 16px Arial,sans-serif}
    </style>
    <marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#00d4ff"/></marker>
    <marker id="headGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#00ff96"/></marker>
  </defs>
  <rect class="bg" width="1440" height="930"/>
  <text class="diagramTitle" x="720" y="40" text-anchor="middle">How one public wildcard certificate reaches every service</text>
  <g transform="translate(0,60)">
  <text class="zoneTitle" x="50" y="42">PUBLIC AUTHORITY AND DNS</text>
  <rect class="zone" x="35" y="58" width="390" height="255" rx="14"/>
  <rect class="box" x="70" y="100" width="150" height="92" rx="10"/>
  <text class="label" x="145" y="137" text-anchor="middle">Let’s Encrypt</text><text class="small" x="145" y="164" text-anchor="middle">ACME issuer</text>
  <rect class="box" x="240" y="100" width="150" height="92" rx="10"/>
  <text class="label" x="315" y="137" text-anchor="middle">Cloudflare</text><text class="small" x="315" y="164" text-anchor="middle">DNS-01 record</text>
  <rect class="lane" x="70" y="220" width="320" height="62" rx="8"/><text class="laneText" x="230" y="247" text-anchor="middle">TXT challenge proves domain control</text><text class="laneText" x="230" y="270" text-anchor="middle">Signed wildcard returns to cert-manager</text>

  <text class="zoneTitle" x="470" y="42">KUBERNETES</text>
  <rect class="zone" x="455" y="58" width="390" height="255" rx="14"/>
  <rect class="box" x="490" y="100" width="150" height="92" rx="10"/><text class="label" x="565" y="137" text-anchor="middle">cert-manager</text><text class="small" x="565" y="164" text-anchor="middle">one Certificate</text>
  <rect class="box" x="660" y="100" width="150" height="92" rx="10"/><text class="label" x="735" y="137" text-anchor="middle">Source Secret</text><text class="small" x="735" y="164" text-anchor="middle">certificate + key</text>
  <rect class="lane" x="490" y="220" width="320" height="62" rx="8"/><text class="laneText" x="650" y="247" text-anchor="middle">Only cert-manager writes the source</text><text class="laneText" x="650" y="270" text-anchor="middle">Certificate and key are validated together</text>

  <text class="zoneTitle" x="890" y="42">AUTOMATION</text>
  <rect class="zone" x="875" y="58" width="530" height="255" rx="14"/>
  <rect class="box" x="910" y="100" width="200" height="92" rx="10"/><text class="label" x="1010" y="137" text-anchor="middle">Jenkins sync job</text><text class="small" x="1010" y="164" text-anchor="middle">validate, deploy, clean up</text>
  <rect class="verify" x="1130" y="100" width="240" height="92" rx="10"/><text class="label" x="1250" y="137" text-anchor="middle">On-wire verification</text><text class="small" x="1250" y="164" text-anchor="middle">served fingerprint = source</text>
  <rect class="lane" x="910" y="220" width="460" height="62" rx="8"/><text class="laneText" x="1140" y="247" text-anchor="middle">A run fails if a target copies but does not reload</text><text class="laneText" x="1140" y="270" text-anchor="middle">Temporary certificate and key files are always removed</text>

  <path class="arrow" d="M220 146 H240"/><path class="arrow" d="M390 146 H490"/><path class="arrow" d="M640 146 H660"/><path class="arrow" d="M810 146 H910"/><path class="arrow green" d="M1110 146 H1130"/>

  <text class="zoneTitle" x="50" y="365">REGISTERED DESTINATIONS</text>
  <rect class="zone" x="35" y="382" width="1370" height="250" rx="14"/>
  <rect class="box" x="75" y="430" width="270" height="120" rx="10"/><text class="label" x="210" y="466" text-anchor="middle">Kubernetes namespaces</text><text class="small" x="210" y="495" text-anchor="middle">patch existing TLS Secrets</text><text class="small" x="210" y="520" text-anchor="middle">Traefik watches and reloads</text>
  <rect class="box" x="385" y="430" width="270" height="120" rx="10"/><text class="label" x="520" y="466" text-anchor="middle">Linux web services</text><text class="small" x="520" y="495" text-anchor="middle">atomic file replacement</text><text class="small" x="520" y="520" text-anchor="middle">reload or restart one service</text>
  <rect class="box" x="695" y="430" width="270" height="120" rx="10"/><text class="label" x="830" y="466" text-anchor="middle">Product helpers</text><text class="small" x="830" y="495" text-anchor="middle">pinned SSH + forced command</text><text class="small" x="830" y="520" text-anchor="middle">bounded certificate install</text>
  <rect class="box" x="1005" y="430" width="270" height="120" rx="10"/><text class="label" x="1140" y="466" text-anchor="middle">Appliance API</text><text class="small" x="1140" y="495" text-anchor="middle">update one managed object</text><text class="small" x="1140" y="520" text-anchor="middle">restart only the web service</text>
  <path class="arrow" d="M910 170 H880 V400 H210 V430"/><path class="arrow" d="M880 400 H520 V430"/><path class="arrow" d="M880 400 H830 V430"/><path class="arrow" d="M880 400 H1140 V430"/>
  <rect class="verify" x="210" y="580" width="1060" height="34" rx="8"/><text class="small" x="740" y="603" text-anchor="middle">Blackbox exporter repeats a TLS handshake after deployment and continues measuring expiry from the live endpoint</text>
  </g>
  <rect class="lane" x="35" y="750" width="1370" height="155" rx="10"/>
  <text class="footerText" x="65" y="780">Let’s Encrypt and cert-manager create one source. Jenkins deploys that source through the method each destination supports.</text>
  <text class="footerText" x="65" y="806">The run finishes only after a new TLS connection returns the same certificate fingerprint as the Kubernetes source.</text>
  <line x1="65" y1="834" x2="97" y2="834" stroke="#00d4ff" stroke-width="4"/><text class="legendText" x="112" y="838">Cyan. Automated action or delivery path.</text>
  <line x1="65" y1="856" x2="97" y2="856" stroke="#00ff96" stroke-width="4"/><text class="legendText" x="112" y="860">Green. Independent verification performed after deployment.</text>
  <rect x="65" y="870" width="32" height="16" rx="5" fill="#131d2d" stroke="#00d4ff"/><text class="legendText" x="112" y="882">Rounded box. Authority, controller, job, store, or destination.</text>
  <line x1="65" y1="902" x2="97" y2="902" stroke="#00d4ff" stroke-width="3" marker-end="url(#head)"/><text class="legendText" x="112" y="906">Arrow. Direction of work or data.</text>
</svg>

