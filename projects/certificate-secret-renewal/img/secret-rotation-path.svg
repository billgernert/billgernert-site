<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1010" role="img" aria-labelledby="title desc">
  <title id="title">Secret rotation with overlap and validation</title>
  <desc id="desc">A scheduled Jenkins worker uses a registry and scoped Vault identity, creates a provider credential, compare-and-set updates Vault, activates one consumer, validates it, waits through overlap, and retires the exact predecessor.</desc>
  <defs><style>.bg{fill:#090e18}.zone{fill:#0e1522;stroke:#24324a;stroke-width:2}.box{fill:#131d2d;stroke:#00d4ff;stroke-width:2}.good{fill:#10231f;stroke:#00ff96;stroke-width:2}.warn{fill:#241f13;stroke:#ffd166;stroke-width:2}.h{fill:#eef4fb;font:600 19px Arial,sans-serif}.p{fill:#aebbd0;font:15px Arial,sans-serif}.z{fill:#00d4ff;font:700 14px Arial,sans-serif;letter-spacing:1.4px}.diagramTitle{fill:#eef4fb;font:700 28px Arial,sans-serif}.footerText{fill:#d8e2ee;font:16px Arial,sans-serif}.legendText{fill:#aebbd0;font:14px Arial,sans-serif}.arrow{fill:none;stroke:#00d4ff;stroke-width:3;marker-end:url(#a)}.green{stroke:#00ff96;marker-end:url(#b)}.dash{stroke-dasharray:9 7}.lane{fill:#0b111d;stroke:#31415d}.laneText{fill:#aebbd0;font:15px Arial,sans-serif}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#00d4ff"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#00ff96"/></marker></defs>
  <rect class="bg" width="1500" height="1010"/>
  <text class="diagramTitle" x="750" y="40" text-anchor="middle">How a replacement secret reaches one application safely</text>
  <g transform="translate(0,60)">
  <text class="z" x="55" y="40">DECISION AND AUTHORITY</text><rect class="zone" x="40" y="56" width="1420" height="255" rx="14"/>
  <rect class="box" x="75" y="100" width="190" height="100" rx="10"/><text class="h" x="170" y="138" text-anchor="middle">Git registry</text><text class="p" x="170" y="166" text-anchor="middle">provider, consumer,</text><text class="p" x="170" y="188" text-anchor="middle">adapter, probe, policy</text>
  <rect class="box" x="310" y="100" width="190" height="100" rx="10"/><text class="h" x="405" y="138" text-anchor="middle">Jenkins worker</text><text class="p" x="405" y="166" text-anchor="middle">daily due decision</text><text class="p" x="405" y="188" text-anchor="middle">one credential class</text>
  <rect class="box" x="545" y="100" width="190" height="100" rx="10"/><text class="h" x="640" y="138" text-anchor="middle">Scoped AppRole</text><text class="p" x="640" y="166" text-anchor="middle">only required</text><text class="p" x="640" y="188" text-anchor="middle">Vault paths</text>
  <rect class="box" x="780" y="100" width="190" height="100" rx="10"/><text class="h" x="875" y="138" text-anchor="middle">Provider API</text><text class="p" x="875" y="166" text-anchor="middle">create replacement</text><text class="p" x="875" y="188" text-anchor="middle">return once</text>
  <rect class="box" x="1015" y="100" width="190" height="100" rx="10"/><text class="h" x="1110" y="138" text-anchor="middle">Vault KV</text><text class="p" x="1110" y="166" text-anchor="middle">compare-and-set</text><text class="p" x="1110" y="188" text-anchor="middle">preserve siblings</text>
  <rect class="warn" x="1250" y="100" width="175" height="100" rx="10"/><text class="h" x="1337" y="138" text-anchor="middle">Overlap state</text><text class="p" x="1337" y="166" text-anchor="middle">old identifier</text><text class="p" x="1337" y="188" text-anchor="middle">retire-after time</text>
  <path class="arrow" d="M265 150H310"/><path class="arrow" d="M500 150H545"/><path class="arrow" d="M735 150H780"/><path class="arrow" d="M970 150H1015"/><path class="arrow" d="M1205 150H1250"/>
  <text class="z" x="55" y="365">ACTIVATION ADAPTERS</text><rect class="zone" x="40" y="381" width="920" height="250" rx="14"/>
  <rect class="box" x="75" y="425" width="185" height="115" rx="10"/><text class="h" x="167" y="460" text-anchor="middle">Kubernetes</text><text class="p" x="167" y="488" text-anchor="middle">one Secret field</text><text class="p" x="167" y="510" text-anchor="middle">one rollout</text>
  <rect class="box" x="295" y="425" width="185" height="115" rx="10"/><text class="h" x="387" y="460" text-anchor="middle">Read at start</text><text class="p" x="387" y="488" text-anchor="middle">next process reads</text><text class="p" x="387" y="510" text-anchor="middle">Vault directly</text>
  <rect class="box" x="515" y="425" width="185" height="115" rx="10"/><text class="h" x="607" y="460" text-anchor="middle">Host helper</text><text class="p" x="607" y="488" text-anchor="middle">pinned SSH</text><text class="p" x="607" y="510" text-anchor="middle">stdin-only command</text>
  <rect class="box" x="735" y="425" width="185" height="115" rx="10"/><text class="h" x="827" y="460" text-anchor="middle">Provider resource</text><text class="p" x="827" y="488" text-anchor="middle">update one exact</text><text class="p" x="827" y="510" text-anchor="middle">integration object</text>
  <path class="arrow" d="M1015 180H975V400H167V425"/><path class="arrow" d="M975 400H387V425"/><path class="arrow" d="M975 400H607V425"/><path class="arrow" d="M975 400H827V425"/>

  <text class="z" x="1010" y="365">VALIDATION AND RETIREMENT</text><rect class="zone" x="995" y="381" width="465" height="330" rx="14"/>
  <rect class="good" x="1035" y="425" width="385" height="92" rx="10"/><text class="h" x="1227" y="460" text-anchor="middle">Four-part validation</text><text class="p" x="1227" y="488" text-anchor="middle">provider + Vault binding + workload + real route</text>
  <rect class="warn" x="1035" y="550" width="180" height="105" rx="10"/><text class="h" x="1125" y="585" text-anchor="middle">Seven-day soak</text><text class="p" x="1125" y="613" text-anchor="middle">both remain valid</text><text class="p" x="1125" y="635" text-anchor="middle">revalidate later</text>
  <rect class="good" x="1240" y="550" width="180" height="105" rx="10"/><text class="h" x="1330" y="585" text-anchor="middle">Exact retirement</text><text class="p" x="1330" y="613" text-anchor="middle">delete recorded</text><text class="p" x="1330" y="635" text-anchor="middle">predecessor only</text>
  <path class="arrow green" d="M920 482H1035"/><path class="arrow green" d="M1227 517V535H1125V550"/><path class="arrow green" d="M1215 603H1240"/>
  <rect class="lane" x="75" y="575" width="845" height="34" rx="8"/><text class="laneText" x="497" y="597" text-anchor="middle">Any activation or validation failure keeps both provider credentials and reports a pending state</text>
  </g>
  <rect class="lane" x="40" y="830" width="1420" height="155" rx="10"/>
  <text class="footerText" x="70" y="860">The provider creates the value. Vault stores it. One registered adapter updates the application that consumes it.</text>
  <text class="footerText" x="70" y="886">Provider, binding, workload, and real-route checks must pass before the recorded predecessor can be retired.</text>
  <line x1="70" y1="914" x2="102" y2="914" stroke="#00d4ff" stroke-width="4"/><text class="legendText" x="117" y="918">Cyan. Automated decision, write, or activation path.</text>
  <line x1="70" y1="936" x2="102" y2="936" stroke="#00ff96" stroke-width="4"/><text class="legendText" x="117" y="940">Green. Validation and retirement after success. Amber box. Overlap state that keeps the predecessor available.</text>
  <rect x="70" y="950" width="32" height="16" rx="5" fill="#131d2d" stroke="#00d4ff"/><text class="legendText" x="117" y="962">Rounded box. Registry, worker, provider, store, adapter, state, or check.</text>
  <line x1="70" y1="982" x2="102" y2="982" stroke="#00d4ff" stroke-width="3" marker-end="url(#a)"/><text class="legendText" x="117" y="986">Arrow. Direction of work or data.</text>
</svg>

