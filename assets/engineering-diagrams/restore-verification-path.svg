<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-label="Restore verification from manifest selection through backup, fenced boot, assertions, evidence, and verified teardown"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.h{font:700 24px Arial;fill:#fff}.t{font:700 16px Arial;fill:#eef4fb}.s{font:13px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.r{fill:#28131a;stroke:#ff5c7a;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#00ff96;stroke-width:2;fill:none;stroke-dasharray:7 6}</style></defs><rect width="1160" height="720" fill="#090e18"/><text x="50" y="52" class="h">A weekly restore run creates evidence, then removes the evidence machine</text><rect x="40" y="110" width="170" height="105" rx="12" class="n"/><text x="125" y="145" text-anchor="middle" class="t">1. Manifest</text><text x="125" y="173" text-anchor="middle" class="s">Next protected class</text><text x="125" y="195" text-anchor="middle" class="s">and backup source</text><rect x="250" y="110" width="170" height="105" rx="12" class="n"/><text x="335" y="145" text-anchor="middle" class="t">2. Preflight</text><text x="335" y="173" text-anchor="middle" class="s">Identity, fence, target</text><text x="335" y="195" text-anchor="middle" class="s">and scratch absence</text><rect x="460" y="110" width="170" height="105" rx="12" class="n"/><text x="545" y="145" text-anchor="middle" class="t">3. PBS restore</text><text x="545" y="173" text-anchor="middle" class="s">Selected snapshot to</text><text x="545" y="195" text-anchor="middle" class="s">reserved scratch guest</text><rect x="670" y="110" width="190" height="105" rx="12" class="w"/><text x="765" y="145" text-anchor="middle" class="t">4. Fenced boot</text><text x="765" y="173" text-anchor="middle" class="s">No production uplink</text><text x="765" y="195" text-anchor="middle" class="s">Guest agent may answer</text><rect x="900" y="110" width="215" height="105" rx="12" class="g"/><text x="1008" y="145" text-anchor="middle" class="t">5. Assertions</text><text x="1008" y="173" text-anchor="middle" class="s">OS, filesystem, identity</text><text x="1008" y="195" text-anchor="middle" class="s">and service profile</text><line x1="210" y1="162" x2="245" y2="162" class="l"/><line x1="420" y1="162" x2="455" y2="162" class="l"/><line x1="630" y1="162" x2="665" y2="162" class="l"/><line x1="860" y1="162" x2="895" y2="162" class="l"/><rect x="190" y="340" width="265" height="115" rx="12" class="n"/><text x="322" y="378" text-anchor="middle" class="t">6. Evidence and email</text><text x="322" y="407" text-anchor="middle" class="s">Result, duration, assertion list,</text><text x="322" y="431" text-anchor="middle" class="s">source class and safe failure reason</text><rect x="600" y="340" width="290" height="115" rx="12" class="r"/><text x="745" y="378" text-anchor="middle" class="t">7. Unconditional teardown</text><text x="745" y="407" text-anchor="middle" class="s">Delete scratch guest on pass or fail</text><text x="745" y="431" text-anchor="middle" class="s">then query Proxmox for absence</text><path d="M1008 215C1008 290 500 285 390 335" class="l"/><path d="M455 397H595" class="l"/><rect x="310" y="535" width="540" height="90" rx="12" class="g"/><text x="580" y="571" text-anchor="middle" class="t">Prometheus records freshness, result, duration and coverage</text><text x="580" y="600" text-anchor="middle" class="s">A previous pass ages out when the next expected recovery evidence does not arrive.</text><path d="M322 455C350 500 430 510 490 535" class="d"/><path d="M745 455C720 500 670 510 635 535" class="d"/><g transform="translate(55 675)"><rect width="16" height="16" fill="#101a28" stroke="#00d4ff"/><text x="26" y="14" class="s">Cyan: orchestration or evidence</text><rect x="300" width="16" height="16" fill="#10231d" stroke="#00ff96"/><text x="326" y="14" class="s">Green: verified result</text><rect x="535" width="16" height="16" fill="#271f0e" stroke="#ffd166"/><text x="561" y="14" class="s">Amber: isolated recovery boundary</text><rect x="825" width="16" height="16" fill="#28131a" stroke="#ff5c7a"/><text x="851" y="14" class="s">Red: cleanup path runs on every outcome</text></g></svg>
