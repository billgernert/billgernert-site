<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" role="img" aria-label="Renovate weekly scan finds pinned updates, groups pull requests, runs normal CI and waits for review because automerge remains disabled">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.h{font:700 25px Arial;fill:#fff}.t{font:700 16px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.r{fill:#28131a;stroke:#ff5c7a;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1160" height="700" fill="#090e18"/><text x="50" y="52" class="h">Renovate remembers the pins and opens the change; the ordinary merge path decides whether it lands</text>
  <rect x="45" y="115" width="210" height="135" rx="12" class="n"/><text x="150" y="153" text-anchor="middle" class="t">Weekly CronJob</text><text x="150" y="183" text-anchor="middle" class="s">Runs a pinned Renovate image</text><text x="150" y="209" text-anchor="middle" class="s">Uses one scoped git identity</text><text x="150" y="233" text-anchor="middle" class="s">Reads configuration from git</text>
  <rect x="330" y="115" width="210" height="135" rx="12" class="n"/><text x="435" y="153" text-anchor="middle" class="t">Pin inventory</text><text x="435" y="183" text-anchor="middle" class="s">Images, tools, actions and plugins</text><text x="435" y="209" text-anchor="middle" class="s">Custom matchers cover local formats</text><text x="435" y="233" text-anchor="middle" class="s">Tests catch a matcher that sees zero</text>
  <rect x="615" y="115" width="210" height="135" rx="12" class="g"/><text x="720" y="153" text-anchor="middle" class="t">Grouped pull request</text><text x="720" y="183" text-anchor="middle" class="s">Routine updates travel together</text><text x="720" y="209" text-anchor="middle" class="s">Major versions remain separate</text><text x="720" y="233" text-anchor="middle" class="s">The diff records every changed pin</text>
  <rect x="900" y="115" width="215" height="135" rx="12" class="w"/><text x="1008" y="153" text-anchor="middle" class="t">Normal CI and review</text><text x="1008" y="183" text-anchor="middle" class="s">Secret, syntax and image checks</text><text x="1008" y="209" text-anchor="middle" class="s">A reviewer reads impact and failures</text><text x="1008" y="233" text-anchor="middle" class="s">The bot cannot merge the branch</text>
  <line x1="255" y1="183" x2="325" y2="183" class="l"/><line x1="540" y1="183" x2="610" y2="183" class="l"/><line x1="825" y1="183" x2="895" y2="183" class="l"/>
  <rect x="165" y="390" width="330" height="135" rx="12" class="n"/><text x="330" y="428" text-anchor="middle" class="t">Risk classifier, observe only</text><text x="330" y="458" text-anchor="middle" class="s">Labels low, medium or high</text><text x="330" y="484" text-anchor="middle" class="s">An invalid answer becomes high</text><text x="330" y="508" text-anchor="middle" class="s">Its explanation can aid review</text>
  <rect x="665" y="390" width="330" height="135" rx="12" class="r"/><text x="830" y="428" text-anchor="middle" class="t">Automerge path stays closed</text><text x="830" y="458" text-anchor="middle" class="s">Feature flag is off</text><text x="830" y="484" text-anchor="middle" class="s">Evaluation remains in observe mode</text><text x="830" y="508" text-anchor="middle" class="s">Major updates are excluded permanently</text>
  <path d="M1008 250C1008 320 400 310 340 385" class="l"/><line x1="495" y1="458" x2="660" y2="458" class="l"/>
  <rect x="250" y="575" width="660" height="65" rx="12" class="n"/><text x="580" y="602" text-anchor="middle" class="t">If the bot becomes unreliable, the written fallback is a scheduled manual pin review</text><text x="580" y="626" text-anchor="middle" class="s">Automation is useful only while its inventory and pull requests remain visible and reviewable.</text>
  <g transform="translate(235 670)"><rect width="16" height="16" fill="#101a28" stroke="#00d4ff"/><text x="26" y="14" class="s">Cyan: automated discovery</text><rect x="300" width="16" height="16" fill="#271f0e" stroke="#ffd166"/><text x="326" y="14" class="s">Amber: review gate</text><rect x="555" width="16" height="16" fill="#28131a" stroke="#ff5c7a"/><text x="581" y="14" class="s">Red: disabled action</text></g>
</svg>
