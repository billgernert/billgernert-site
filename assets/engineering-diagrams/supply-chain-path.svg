<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-label="Software supply chain from source scan through image build, vulnerability scan, digest pin, signature and provenance verification to planned admission enforcement">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.h{font:700 25px Arial;fill:#fff}.t{font:700 16px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.r{fill:#28131a;stroke:#ff5c7a;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1160" height="720" fill="#090e18"/><text x="50" y="52" class="h">The build checks source and image content, then binds the reviewed result to one immutable digest</text>
  <rect x="45" y="115" width="200" height="135" rx="12" class="n"/><text x="145" y="153" text-anchor="middle" class="t">Source change</text><text x="145" y="183" text-anchor="middle" class="s">Secret scan on push and PR</text><text x="145" y="209" text-anchor="middle" class="s">Infrastructure and code scan</text><text x="145" y="233" text-anchor="middle" class="s">A finding blocks the merge</text>
  <rect x="330" y="115" width="200" height="135" rx="12" class="n"/><text x="430" y="153" text-anchor="middle" class="t">Fresh image build</text><text x="430" y="183" text-anchor="middle" class="s">Kaniko builds inside the cluster</text><text x="430" y="209" text-anchor="middle" class="s">Base and application layers included</text><text x="430" y="233" text-anchor="middle" class="s">Weekly rebuild exposes new CVEs</text>
  <rect x="615" y="115" width="200" height="135" rx="12" class="n"/><text x="715" y="153" text-anchor="middle" class="t">Image scan</text><text x="715" y="183" text-anchor="middle" class="s">Known package vulnerabilities</text><text x="715" y="209" text-anchor="middle" class="s">Accepted findings need a reason</text><text x="715" y="233" text-anchor="middle" class="s">No-fix does not mean forgotten</text>
  <rect x="900" y="115" width="215" height="135" rx="12" class="g"/><text x="1008" y="153" text-anchor="middle" class="t">Registry digest</text><text x="1008" y="183" text-anchor="middle" class="s">Names the exact image bytes</text><text x="1008" y="209" text-anchor="middle" class="s">Promotion updates the digest</text><text x="1008" y="233" text-anchor="middle" class="s">A tag cannot move the workload</text>
  <line x1="245" y1="183" x2="325" y2="183" class="l"/><line x1="530" y1="183" x2="610" y2="183" class="l"/><line x1="815" y1="183" x2="895" y2="183" class="l"/>
  <rect x="170" y="385" width="310" height="135" rx="12" class="w"/><text x="325" y="423" text-anchor="middle" class="t">Signature + provenance</text><text x="325" y="453" text-anchor="middle" class="s">Cosign signs the exact digest</text><text x="325" y="479" text-anchor="middle" class="s">Attestation records build origin</text><text x="325" y="503" text-anchor="middle" class="s">Key is read at signing time</text>
  <rect x="680" y="385" width="310" height="135" rx="12" class="g"/><text x="835" y="423" text-anchor="middle" class="t">Cold verification</text><text x="835" y="453" text-anchor="middle" class="s">A separate machine trusts the public key</text><text x="835" y="479" text-anchor="middle" class="s">Signature and provenance both pass</text><text x="835" y="503" text-anchor="middle" class="s">The running digest matches</text>
  <path d="M1008 250C1008 325 395 300 335 380" class="l"/><line x1="480" y1="453" x2="675" y2="453" class="l"/>
  <rect x="245" y="575" width="670" height="65" rx="12" class="r"/><text x="580" y="602" text-anchor="middle" class="t">Admission enforcement is written and remains off</text><text x="580" y="626" text-anchor="middle" class="s">The cluster does not yet refuse an unsigned image at start time, so the page does not claim that control.</text>
  <g transform="translate(225 678)"><rect width="16" height="16" fill="#101a28" stroke="#00d4ff"/><text x="26" y="14" class="s">Cyan: automated check</text><rect x="270" width="16" height="16" fill="#271f0e" stroke="#ffd166"/><text x="296" y="14" class="s">Amber: signing step</text><rect x="520" width="16" height="16" fill="#28131a" stroke="#ff5c7a"/><text x="546" y="14" class="s">Red: not enforced live</text></g>
</svg>
