<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 680" role="img" aria-label="Accepted risk moves from observed limitation through bounded impact, explicit owner, dated decision, compensating control and review or exit">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.h{font:700 25px Arial;fill:#fff}.t{font:700 16px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.r{fill:#28131a;stroke:#ff5c7a;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1160" height="680" fill="#090e18"/><text x="50" y="52" class="h">Accepting a risk records the cost, the boundary and the event that changes the decision</text>
  <rect x="55" y="120" width="230" height="125" rx="12" class="r"/><text x="170" y="157" text-anchor="middle" class="t">Observed limitation</text><text x="170" y="187" text-anchor="middle" class="s">A design, outage or review</text><text x="170" y="211" text-anchor="middle" class="s">names what can go wrong</text><text x="170" y="235" text-anchor="middle" class="s">No soft language hides it</text>
  <rect x="465" y="95" width="230" height="125" rx="12" class="w"/><text x="580" y="132" text-anchor="middle" class="t">Dated decision</text><text x="580" y="162" text-anchor="middle" class="s">Impact and reason are written</text><text x="580" y="186" text-anchor="middle" class="s">The operator owns the trade</text><text x="580" y="210" text-anchor="middle" class="s">Status is visible to reviewers</text>
  <rect x="875" y="120" width="230" height="125" rx="12" class="n"/><text x="990" y="157" text-anchor="middle" class="t">Compensating control</text><text x="990" y="187" text-anchor="middle" class="s">Limits likelihood or blast radius</text><text x="990" y="211" text-anchor="middle" class="s">Must exist outside the prose</text><text x="990" y="235" text-anchor="middle" class="s">Evidence stays next to the claim</text>
  <line x1="285" y1="182" x2="460" y2="158" class="l"/><line x1="695" y1="158" x2="870" y2="182" class="l"/>
  <rect x="665" y="390" width="300" height="125" rx="12" class="g"/><text x="815" y="427" text-anchor="middle" class="t">Exit condition met</text><text x="815" y="457" text-anchor="middle" class="s">The control lands or the trade changes</text><text x="815" y="481" text-anchor="middle" class="s">Close the row with dated evidence</text><text x="815" y="505" text-anchor="middle" class="s">Update pages that depended on it</text>
  <rect x="195" y="390" width="300" height="125" rx="12" class="n"/><text x="345" y="427" text-anchor="middle" class="t">Scheduled or event review</text><text x="345" y="457" text-anchor="middle" class="s">Re-read the running system and tree</text><text x="345" y="481" text-anchor="middle" class="s">Keep, change or close the decision</text><text x="345" y="505" text-anchor="middle" class="s">Silence is not continued acceptance</text>
  <path d="M990 245C990 330 870 335 830 385" class="l"/><line x1="665" y1="453" x2="500" y2="453" class="l"/><path d="M345 390C305 330 185 330 170 250" class="l"/>
  <rect x="245" y="565" width="670" height="60" rx="12" class="w"/><text x="580" y="590" text-anchor="middle" class="t">Structural risks may have no exit; temporary risks must name one</text><text x="580" y="614" text-anchor="middle" class="s">The register separates an intentional trade from an undocumented gap.</text>
  <g transform="translate(210 646)"><rect width="16" height="16" fill="#28131a" stroke="#ff5c7a"/><text x="26" y="14" class="s">Red: named exposure</text><rect x="260" width="16" height="16" fill="#271f0e" stroke="#ffd166"/><text x="286" y="14" class="s">Amber: operator decision</text><rect x="555" width="16" height="16" fill="#10231d" stroke="#00ff96"/><text x="581" y="14" class="s">Green: verified exit</text></g>
</svg>
