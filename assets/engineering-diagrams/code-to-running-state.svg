<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 680" role="img" aria-label="Source definitions move through review, generation and drift checks into Jenkins and the running platform">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.h{font:700 25px Arial;fill:#fff}.t{font:700 16px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.r{fill:#28131a;stroke:#ff5c7a;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1160" height="680" fill="#090e18"/><text x="50" y="52" class="h">A reviewed source file becomes running state, and drift sends the work back to the source</text>
  <rect x="50" y="120" width="210" height="135" rx="12" class="n"/><text x="155" y="157" text-anchor="middle" class="t">Source definition</text><text x="155" y="187" text-anchor="middle" class="s">Job, manifest, policy or data</text><text x="155" y="211" text-anchor="middle" class="s">Parameters and schedule included</text><text x="155" y="235" text-anchor="middle" class="s">One file owns each fact</text>
  <rect x="335" y="120" width="210" height="135" rx="12" class="w"/><text x="440" y="157" text-anchor="middle" class="t">Pull request</text><text x="440" y="187" text-anchor="middle" class="s">A person reads the diff</text><text x="440" y="211" text-anchor="middle" class="s">CI checks syntax and policy</text><text x="440" y="235" text-anchor="middle" class="s">Only reviewed text advances</text>
  <rect x="620" y="120" width="210" height="135" rx="12" class="n"/><text x="725" y="157" text-anchor="middle" class="t">Generator or controller</text><text x="725" y="187" text-anchor="middle" class="s">Builds the derived artifact</text><text x="725" y="211" text-anchor="middle" class="s">Rejects a stale generated copy</text><text x="725" y="235" text-anchor="middle" class="s">Never asks for a hand edit</text>
  <rect x="905" y="120" width="205" height="135" rx="12" class="g"/><text x="1008" y="157" text-anchor="middle" class="t">Running system</text><text x="1008" y="187" text-anchor="middle" class="s">Jenkins job or workload</text><text x="1008" y="211" text-anchor="middle" class="s">Created from the reviewed state</text><text x="1008" y="235" text-anchor="middle" class="s">Schedule active at creation</text>
  <line x1="260" y1="188" x2="330" y2="188" class="l"/><line x1="545" y1="188" x2="615" y2="188" class="l"/><line x1="830" y1="188" x2="900" y2="188" class="l"/>
  <rect x="225" y="365" width="300" height="125" rx="12" class="r"/><text x="375" y="402" text-anchor="middle" class="t">Drift or missing behavior</text><text x="375" y="432" text-anchor="middle" class="s">Generated output differs</text><text x="375" y="456" text-anchor="middle" class="s">or the live job lacks its trigger</text><text x="375" y="480" text-anchor="middle" class="s">The gate fails visibly</text>
  <rect x="635" y="365" width="300" height="125" rx="12" class="n"/><text x="785" y="402" text-anchor="middle" class="t">Repair the source</text><text x="785" y="432" text-anchor="middle" class="s">Change the owning definition</text><text x="785" y="456" text-anchor="middle" class="s">Regenerate and review again</text><text x="785" y="480" text-anchor="middle" class="s">History keeps the reason</text>
  <path d="M1008 255C1008 320 455 310 405 360" class="l"/><line x1="525" y1="428" x2="630" y2="428" class="l"/><path d="M785 365C760 300 200 330 155 260" class="l"/>
  <rect x="240" y="545" width="680" height="65" rx="12" class="n"/><text x="580" y="572" text-anchor="middle" class="t">The console is an output and a diagnostic view, not the place where durable state is authored</text><text x="580" y="596" text-anchor="middle" class="s">Recovery recreates the tool from reviewed definitions, then checks that the live result matches.</text>
  <g transform="translate(245 642)"><rect width="16" height="16" fill="#101a28" stroke="#00d4ff"/><text x="26" y="14" class="s">Cyan: declared or generated state</text><rect x="350" width="16" height="16" fill="#271f0e" stroke="#ffd166"/><text x="376" y="14" class="s">Amber: review gate</text><rect x="595" width="16" height="16" fill="#28131a" stroke="#ff5c7a"/><text x="621" y="14" class="s">Red: visible drift</text></g>
</svg>
