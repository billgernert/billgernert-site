<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" role="img" aria-label="AI request passes an application credit gate, a per-consumer LiteLLM budget and a global ceiling before reaching a local or hosted model">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.h{font:700 25px Arial;fill:#fff}.t{font:700 16px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.r{fill:#28131a;stroke:#ff5c7a;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1160" height="700" fill="#090e18"/><text x="50" y="52" class="h">One AI request has to pass three independent spending limits</text>
  <rect x="45" y="120" width="205" height="130" rx="12" class="n"/><text x="148" y="159" text-anchor="middle" class="t">Scheduled consumer</text><text x="148" y="190" text-anchor="middle" class="s">Requests a named model</text><text x="148" y="216" text-anchor="middle" class="s">Keeps its own spend ledger</text><text x="148" y="240" text-anchor="middle" class="s">No provider key stored here</text>
  <rect x="300" y="120" width="205" height="130" rx="12" class="w"/><text x="403" y="159" text-anchor="middle" class="t">1. App credit gate</text><text x="403" y="190" text-anchor="middle" class="s">Checks this workload's allowance</text><text x="403" y="216" text-anchor="middle" class="s">Missing or unreadable means deny</text><text x="403" y="240" text-anchor="middle" class="s">Remains as a bypass backstop</text>
  <rect x="555" y="120" width="230" height="130" rx="12" class="w"/><text x="670" y="159" text-anchor="middle" class="t">2. Virtual-key budget</text><text x="670" y="190" text-anchor="middle" class="s">LiteLLM meters one consumer</text><text x="670" y="216" text-anchor="middle" class="s">A separate key defines its scope</text><text x="670" y="240" text-anchor="middle" class="s">One job cannot spend another's cap</text>
  <rect x="835" y="120" width="280" height="130" rx="12" class="w"/><text x="975" y="159" text-anchor="middle" class="t">3. Global monthly ceiling</text><text x="975" y="190" text-anchor="middle" class="s">LiteLLM sees combined gateway spend</text><text x="975" y="216" text-anchor="middle" class="s">The most restrictive limit wins</text><text x="975" y="240" text-anchor="middle" class="s">No consumer can override it</text>
  <line x1="250" y1="185" x2="295" y2="185" class="l"/><line x1="505" y1="185" x2="550" y2="185" class="l"/><line x1="785" y1="185" x2="830" y2="185" class="l"/>
  <rect x="180" y="380" width="300" height="130" rx="12" class="g"/><text x="330" y="418" text-anchor="middle" class="t">Local model route</text><text x="330" y="448" text-anchor="middle" class="s">Routine work stays inside the lab</text><text x="330" y="474" text-anchor="middle" class="s">The gateway keeps one API contract</text><text x="330" y="498" text-anchor="middle" class="s">No per-token provider charge</text>
  <rect x="680" y="380" width="300" height="130" rx="12" class="g"/><text x="830" y="418" text-anchor="middle" class="t">Hosted model route</text><text x="830" y="448" text-anchor="middle" class="s">Hard cases reach the provider</text><text x="830" y="474" text-anchor="middle" class="s">Outbound traffic uses the gateway key</text><text x="830" y="498" text-anchor="middle" class="s">Budget denial returns a loud failure</text>
  <path d="M975 250C975 320 410 300 350 375" class="l"/><path d="M975 250C975 320 835 320 830 375" class="l"/>
  <rect x="255" y="565" width="650" height="70" rx="12" class="r"/><text x="580" y="593" text-anchor="middle" class="t">There is no direct-provider fallback</text><text x="580" y="619" text-anchor="middle" class="s">If the gateway or a budget check fails, the request stops instead of bypassing the controls.</text>
  <g transform="translate(245 666)"><rect width="16" height="16" fill="#101a28" stroke="#00d4ff"/><text x="26" y="14" class="s">Cyan: request source</text><rect x="250" width="16" height="16" fill="#271f0e" stroke="#ffd166"/><text x="276" y="14" class="s">Amber: independent limit</text><rect x="535" width="16" height="16" fill="#10231d" stroke="#00ff96"/><text x="561" y="14" class="s">Green: allowed model route</text></g>
</svg>
