<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 680" role="img" aria-label="Read-only MCP server between an agent and allowlisted lab data sources with code-level exclusions and an audit record">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.h{font:700 25px Arial;fill:#fff}.t{font:700 16px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.r{fill:#28131a;stroke:#ff5c7a;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}.x{stroke:#ff5c7a;stroke-width:5}</style></defs>
  <rect width="1160" height="680" fill="#090e18"/><text x="50" y="52" class="h">The MCP server turns a broad question into a small set of audited, read-only calls</text>
  <rect x="45" y="130" width="220" height="135" rx="12" class="w"/><text x="155" y="169" text-anchor="middle" class="t">Agent request</text><text x="155" y="199" text-anchor="middle" class="s">A question about live state</text><text x="155" y="223" text-anchor="middle" class="s">No credential or shell supplied</text><text x="155" y="247" text-anchor="middle" class="s">Untrusted text remains data</text>
  <rect x="350" y="105" width="300" height="185" rx="14" class="n"/><text x="500" y="145" text-anchor="middle" class="t">Read-only MCP server</text><text x="500" y="178" text-anchor="middle" class="s">Publishes named tools, not a general API</text><text x="500" y="204" text-anchor="middle" class="s">Validates arguments and limits results</text><text x="500" y="230" text-anchor="middle" class="s">Code exclusions cannot be enabled at runtime</text><text x="500" y="256" text-anchor="middle" class="s">Every call emits an audit record</text>
  <rect x="755" y="105" width="355" height="185" rx="14" class="g"/><text x="933" y="145" text-anchor="middle" class="t">Allowlisted read adapters</text><text x="933" y="178" text-anchor="middle" class="s">Monitoring problems and health</text><text x="933" y="204" text-anchor="middle" class="s">Inventory and service metadata</text><text x="933" y="230" text-anchor="middle" class="s">Build and deployment status</text><text x="933" y="256" text-anchor="middle" class="s">Public-safe summaries returned</text>
  <line x1="265" y1="198" x2="345" y2="198" class="l"/><line x1="650" y1="198" x2="750" y2="198" class="l"/>
  <rect x="185" y="400" width="330" height="120" rx="12" class="r"/><text x="350" y="438" text-anchor="middle" class="t">No mutation surface</text><text x="350" y="468" text-anchor="middle" class="s">No create, edit, restart or delete tool</text><text x="350" y="494" text-anchor="middle" class="s">No general shell and no token minting</text>
  <line x1="190" y1="410" x2="505" y2="510" class="x"/><line x1="505" y1="410" x2="190" y2="510" class="x"/>
  <rect x="645" y="400" width="330" height="120" rx="12" class="n"/><text x="810" y="438" text-anchor="middle" class="t">Append-only audit record</text><text x="810" y="468" text-anchor="middle" class="s">Tool, arguments, time and result summary</text><text x="810" y="494" text-anchor="middle" class="s">Values and credentials are not recorded</text>
  <path d="M500 290C500 350 760 335 790 395" class="l"/>
  <rect x="245" y="565" width="670" height="60" rx="12" class="n"/><text x="580" y="590" text-anchor="middle" class="t">Adding a write tool would be a separate design and review, not a switch on this server</text><text x="580" y="614" text-anchor="middle" class="s">The smallest useful surface ships first, with its unreachable systems excluded in code.</text>
  <g transform="translate(235 646)"><rect width="16" height="16" fill="#101a28" stroke="#00d4ff"/><text x="26" y="14" class="s">Cyan: enforced boundary</text><rect x="275" width="16" height="16" fill="#10231d" stroke="#00ff96"/><text x="301" y="14" class="s">Green: allowed read</text><rect x="545" width="16" height="16" fill="#28131a" stroke="#ff5c7a"/><text x="571" y="14" class="s">Red: capability not present</text></g>
</svg>
