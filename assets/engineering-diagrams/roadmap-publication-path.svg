<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-label="Roadmap publication from private backlog through reviewed public descriptions, generation and scrub gates to a live dashboard and generated fallback">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.h{font:700 25px Arial;fill:#fff}.t{font:700 16px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.r{fill:#28131a;stroke:#ff5c7a;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#00ff96;stroke-width:2;fill:none;stroke-dasharray:7 6}</style></defs>
  <rect width="1160" height="720" fill="#090e18"/><text x="50" y="52" class="h">Private work becomes a current public roadmap through two guarded outputs</text>
  <rect x="45" y="105" width="220" height="125" rx="12" class="n"/><text x="155" y="142" text-anchor="middle" class="t">Tracked backlog</text><text x="155" y="171" text-anchor="middle" class="s">Status, tier and delivery date</text><text x="155" y="195" text-anchor="middle" class="s">Raw titles remain private</text><text x="155" y="218" text-anchor="middle" class="s">One source for every count</text>
  <rect x="330" y="105" width="220" height="125" rx="12" class="w"/><text x="440" y="142" text-anchor="middle" class="t">Reviewed public sentence</text><text x="440" y="171" text-anchor="middle" class="s">Optional and explicit</text><text x="440" y="195" text-anchor="middle" class="s">Only completed work is eligible</text><text x="440" y="218" text-anchor="middle" class="s">No raw title fallback</text>
  <rect x="615" y="105" width="220" height="125" rx="12" class="n"/><text x="725" y="142" text-anchor="middle" class="t">Generator</text><text x="725" y="171" text-anchor="middle" class="s">Counts fixed tier names</text><text x="725" y="195" text-anchor="middle" class="s">and copies approved text</text><text x="725" y="218" text-anchor="middle" class="s">It does not write prose</text>
  <rect x="900" y="105" width="215" height="125" rx="12" class="r"/><text x="1008" y="142" text-anchor="middle" class="t">Scrub + freshness gates</text><text x="1008" y="171" text-anchor="middle" class="s">Reject private strings</text><text x="1008" y="195" text-anchor="middle" class="s">Reject missing markers</text><text x="1008" y="218" text-anchor="middle" class="s">Detect a false fresh stamp</text>
  <line x1="265" y1="167" x2="325" y2="167" class="l"/><line x1="550" y1="167" x2="610" y2="167" class="l"/><line x1="835" y1="167" x2="895" y2="167" class="l"/>
  <rect x="165" y="355" width="330" height="135" rx="14" class="g"/><text x="330" y="393" text-anchor="middle" class="t">Live Grafana dashboard</text><text x="330" y="423" text-anchor="middle" class="s">Progress, tiers, themes, learning</text><text x="330" y="448" text-anchor="middle" class="s">and recently delivered outcomes</text><text x="330" y="475" text-anchor="middle" class="s">Current data for exploration</text>
  <rect x="665" y="355" width="330" height="135" rx="14" class="g"/><text x="830" y="393" text-anchor="middle" class="t">Generated HTML snapshot</text><text x="830" y="423" text-anchor="middle" class="s">Tier totals, completed work</text><text x="830" y="448" text-anchor="middle" class="s">recent outcomes and an as-of date</text><text x="830" y="475" text-anchor="middle" class="s">Readable when the iframe is unavailable</text>
  <path d="M1008 230C1008 300 450 285 360 350" class="l"/><path d="M1008 230C1008 300 850 290 830 350" class="l"/>
  <rect x="285" y="565" width="590" height="80" rx="12" class="n"/><text x="580" y="597" text-anchor="middle" class="t">The page explains the plan; generated facts report its current state</text><text x="580" y="625" text-anchor="middle" class="s">A failed live view does not erase the last dated snapshot, and a failed gate publishes neither output.</text>
  <path d="M330 490C380 535 445 545 500 565" class="d"/><path d="M830 490C780 535 715 545 660 565" class="d"/>
  <g transform="translate(145 680)"><rect width="16" height="16" fill="#101a28" stroke="#00d4ff"/><text x="26" y="14" class="s">Cyan: source or generator</text><rect x="280" width="16" height="16" fill="#271f0e" stroke="#ffd166"/><text x="306" y="14" class="s">Amber: human-reviewed public text</text><rect x="625" width="16" height="16" fill="#10231d" stroke="#00ff96"/><text x="651" y="14" class="s">Green: public output</text></g>
</svg>
