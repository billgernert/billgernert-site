<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" role="img" aria-label="Written tasking passes dispatch gates, runs in an isolated worker, opens a pull request, crosses review and merge gates, and returns to durable repository state"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.h{font:700 24px Arial;fill:#fff}.t{font:700 16px Arial;fill:#eef4fb}.s{font:13px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#00ff96;stroke-width:2;fill:none;stroke-dasharray:7 6}</style></defs><rect width="1180" height="700" fill="#090e18"/><text x="50" y="52" class="h">One tasking becomes one reviewed pull request</text><rect x="40" y="110" width="190" height="115" rx="12" class="w"/><text x="135" y="145" text-anchor="middle" class="t">Written tasking</text><text x="135" y="174" text-anchor="middle" class="s">Objective, scope, evidence,</text><text x="135" y="198" text-anchor="middle" class="s">authority and stop conditions</text><rect x="275" y="110" width="200" height="115" rx="12" class="g"/><text x="375" y="145" text-anchor="middle" class="t">Dispatch gates</text><text x="375" y="174" text-anchor="middle" class="s">PAUSE, cap, PID, slot,</text><text x="375" y="198" text-anchor="middle" class="s">prior pull request</text><rect x="520" y="110" width="200" height="115" rx="12" class="n"/><text x="620" y="145" text-anchor="middle" class="t">Isolated worker</text><text x="620" y="174" text-anchor="middle" class="s">One worktree and branch</text><text x="620" y="198" text-anchor="middle" class="s">Read, edit, test, push</text><rect x="765" y="110" width="190" height="115" rx="12" class="n"/><text x="860" y="145" text-anchor="middle" class="t">Gitea pull request</text><text x="860" y="174" text-anchor="middle" class="s">Durable result and</text><text x="860" y="198" text-anchor="middle" class="s">consumption signal</text><rect x="1000" y="110" width="145" height="115" rx="12" class="g"/><text x="1072" y="145" text-anchor="middle" class="t">Worker exits</text><text x="1072" y="174" text-anchor="middle" class="s">No self-review</text><text x="1072" y="198" text-anchor="middle" class="s">No merge right</text><line x1="230" y1="168" x2="270" y2="168" class="l"/><line x1="475" y1="168" x2="515" y2="168" class="l"/><line x1="720" y1="168" x2="760" y2="168" class="l"/><line x1="955" y1="168" x2="995" y2="168" class="l"/><rect x="190" y="355" width="225" height="110" rx="12" class="n"/><text x="302" y="391" text-anchor="middle" class="t">Other-vendor review</text><text x="302" y="420" text-anchor="middle" class="s">Task, diff, tests and</text><text x="302" y="444" text-anchor="middle" class="s">one commit-bound verdict</text><rect x="485" y="355" width="225" height="110" rx="12" class="g"/><text x="597" y="391" text-anchor="middle" class="t">Deterministic gates</text><text x="597" y="420" text-anchor="middle" class="s">CI, conflicts, head, scope,</text><text x="597" y="444" text-anchor="middle" class="s">review freshness, authority</text><rect x="780" y="355" width="210" height="110" rx="12" class="g"/><text x="885" y="391" text-anchor="middle" class="t">Merge executor</text><text x="885" y="420" text-anchor="middle" class="s">Narrow action after</text><text x="885" y="444" text-anchor="middle" class="s">judgment and policy agree</text><path d="M860 225C860 295 420 290 330 350" class="l"/><line x1="415" y1="410" x2="480" y2="410" class="l"/><line x1="710" y1="410" x2="775" y2="410" class="l"/><rect x="360" y="545" width="460" height="90" rx="12" class="w"/><text x="590" y="581" text-anchor="middle" class="t">Repository, pull request and run ledger record the outcome</text><text x="590" y="610" text-anchor="middle" class="s">The next cycle reads state again. Follow-up work becomes a new tasking.</text><path d="M885 465C850 515 760 525 705 545" class="d"/><g transform="translate(55 665)"><rect width="16" height="16" fill="#101a28" stroke="#00d4ff"/><text x="26" y="14" class="s">Cyan: model work or pull-request state</text><rect x="355" width="16" height="16" fill="#10231d" stroke="#00ff96"/><text x="381" y="14" class="s">Green: enforced gate or review boundary</text><rect x="735" width="16" height="16" fill="#271f0e" stroke="#ffd166"/><text x="761" y="14" class="s">Amber: durable instruction or record</text></g></svg>
