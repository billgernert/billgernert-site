<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-label="Applied AI has a repository-agent path and an operational-inference path, both bounded by policy, evidence, and action gates"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.h{font:700 24px Arial;fill:#fff}.t{font:700 17px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#00ff96;stroke-width:2;fill:none;stroke-dasharray:7 6}</style></defs><rect width="1160" height="720" fill="#090e18"/><text x="50" y="52" class="h">Two model paths share policy, evidence and action boundaries</text><rect x="55" y="100" width="1050" height="220" rx="14" fill="none" stroke="#37516c" stroke-width="2"/><text x="80" y="132" class="t">Repository work</text><rect x="90" y="165" width="190" height="105" rx="12" class="w"/><text x="185" y="200" text-anchor="middle" class="t">Written tasking</text><text x="185" y="228" text-anchor="middle" class="s">Scope and stop rules</text><rect x="345" y="165" width="200" height="105" rx="12" class="n"/><text x="445" y="200" text-anchor="middle" class="t">CLI model worker</text><text x="445" y="228" text-anchor="middle" class="s">Isolated worktree</text><rect x="610" y="165" width="200" height="105" rx="12" class="g"/><text x="710" y="200" text-anchor="middle" class="t">Review + CI</text><text x="710" y="228" text-anchor="middle" class="s">Other vendor and gates</text><rect x="875" y="165" width="190" height="105" rx="12" class="g"/><text x="970" y="200" text-anchor="middle" class="t">Merge executor</text><text x="970" y="228" text-anchor="middle" class="s">Narrow action path</text><line x1="280" y1="218" x2="340" y2="218" class="l"/><line x1="545" y1="218" x2="605" y2="218" class="l"/><line x1="810" y1="218" x2="870" y2="218" class="l"/><rect x="55" y="370" width="1050" height="220" rx="14" fill="none" stroke="#37516c" stroke-width="2"/><text x="80" y="402" class="t">Operational inference</text><rect x="90" y="435" width="190" height="105" rx="12" class="n"/><text x="185" y="470" text-anchor="middle" class="t">Collectors + code</text><text x="185" y="498" text-anchor="middle" class="s">Current bounded evidence</text><rect x="345" y="435" width="200" height="105" rx="12" class="g"/><text x="445" y="470" text-anchor="middle" class="t">Policy gateway</text><text x="445" y="498" text-anchor="middle" class="s">Identity, privacy, budget</text><rect x="610" y="435" width="200" height="105" rx="12" class="n"/><text x="710" y="470" text-anchor="middle" class="t">Local or approved model</text><text x="710" y="498" text-anchor="middle" class="s">Constrained response</text><rect x="875" y="435" width="190" height="105" rx="12" class="g"/><text x="970" y="470" text-anchor="middle" class="t">Validated result</text><text x="970" y="498" text-anchor="middle" class="s">Store, report, or propose</text><line x1="280" y1="488" x2="340" y2="488" class="l"/><line x1="545" y1="488" x2="605" y2="488" class="l"/><line x1="810" y1="488" x2="870" y2="488" class="l"/><rect x="335" y="625" width="490" height="55" rx="10" class="w"/><text x="580" y="659" text-anchor="middle" class="t">A separate identity or operator gate owns any infrastructure action</text><path d="M970 540C930 610 830 615 785 625" class="d"/><g transform="translate(55 695)"><rect width="16" height="16" fill="#101a28" stroke="#00d4ff"/><text x="26" y="14" class="s">Cyan: model input or model work</text><rect x="310" width="16" height="16" fill="#10231d" stroke="#00ff96"/><text x="336" y="14" class="s">Green: policy, validation or action gate</text><rect x="675" width="16" height="16" fill="#271f0e" stroke="#ffd166"/><text x="701" y="14" class="s">Amber: durable instruction or operator boundary</text></g></svg>
