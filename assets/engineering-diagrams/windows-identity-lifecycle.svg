<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 780" role="img" aria-label="Windows identity lifecycle from a reviewed request through Active Directory and Entra to first login, followed by disablement and delayed deletion">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00ff96"/></marker>
    <style>.h{font:700 25px Arial;fill:#fff}.t{font:700 16px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.v{fill:#1d1730;stroke:#bf8cff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.r{fill:#28131a;stroke:#ff5c7a;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}.lg{stroke:#00ff96;stroke-width:3;fill:none;marker-end:url(#g)}.d{stroke:#ffd166;stroke-width:2;fill:none;stroke-dasharray:7 6}</style>
  </defs>
  <rect width="1160" height="780" fill="#090e18"/>
  <text x="50" y="52" class="h">One reviewed request becomes on-premises and cloud access</text>
  <rect x="45" y="105" width="180" height="110" rx="12" class="w"/><text x="135" y="140" text-anchor="middle" class="t">1. Request</text><text x="135" y="169" text-anchor="middle" class="s">Person, manager, role</text><text x="135" y="192" text-anchor="middle" class="s">and department</text>
  <rect x="270" y="105" width="185" height="110" rx="12" class="n"/><text x="362" y="140" text-anchor="middle" class="t">2. Validate</text><text x="362" y="169" text-anchor="middle" class="s">Schema, name collision</text><text x="362" y="192" text-anchor="middle" class="s">and role definition</text>
  <rect x="500" y="105" width="185" height="110" rx="12" class="v"/><text x="592" y="140" text-anchor="middle" class="t">3. Vault</text><text x="592" y="169" text-anchor="middle" class="s">Creates one password</text><text x="592" y="192" text-anchor="middle" class="s">with a short handoff</text>
  <rect x="730" y="105" width="185" height="110" rx="12" class="n"/><text x="822" y="140" text-anchor="middle" class="t">4. Active Directory</text><text x="822" y="169" text-anchor="middle" class="s">User, OU, manager</text><text x="822" y="192" text-anchor="middle" class="s">and role groups</text>
  <rect x="960" y="105" width="155" height="110" rx="12" class="g"/><text x="1038" y="140" text-anchor="middle" class="t">5. First login</text><text x="1038" y="169" text-anchor="middle" class="s">Password changes</text><text x="1038" y="192" text-anchor="middle" class="s">before use</text>
  <line x1="225" y1="160" x2="265" y2="160" class="l"/><line x1="455" y1="160" x2="495" y2="160" class="l"/><line x1="685" y1="160" x2="725" y2="160" class="l"/><line x1="915" y1="160" x2="955" y2="160" class="lg"/>
  <rect x="690" y="295" width="285" height="125" rx="12" class="n"/><text x="832" y="330" text-anchor="middle" class="t">Directory synchronization</text><text x="832" y="359" text-anchor="middle" class="s">Copies the AD-owned identity to Entra</text><text x="832" y="383" text-anchor="middle" class="s">The pipeline waits for that object</text><text x="832" y="407" text-anchor="middle" class="s">before cloud assignments begin</text>
  <rect x="330" y="295" width="285" height="125" rx="12" class="v"/><text x="472" y="330" text-anchor="middle" class="t">Entra groups and applications</text><text x="472" y="359" text-anchor="middle" class="s">Graph adds cloud-only groups</text><text x="472" y="383" text-anchor="middle" class="s">and enterprise application access</text><text x="472" y="407" text-anchor="middle" class="s">after synchronization is visible</text>
  <path d="M822 215V290" class="l"/><line x1="690" y1="357" x2="620" y2="357" class="l"/><path d="M330 357C235 357 185 265 135 220" class="d"/><text x="225" y="331" text-anchor="middle" class="s">status returns to the request</text>
  <rect x="45" y="500" width="1070" height="155" rx="14" fill="none" stroke="#37516c" stroke-width="2"/><text x="70" y="535" class="t">Offboarding reverses access before it deletes identity</text>
  <rect x="85" y="565" width="195" height="65" rx="10" class="w"/><text x="182" y="592" text-anchor="middle" class="t">Reviewed offboard</text><text x="182" y="616" text-anchor="middle" class="s">Named requester + approver</text>
  <rect x="330" y="565" width="195" height="65" rx="10" class="n"/><text x="428" y="592" text-anchor="middle" class="t">Snapshot first</text><text x="428" y="616" text-anchor="middle" class="s">Groups, manager and OU</text>
  <rect x="575" y="565" width="195" height="65" rx="10" class="r"/><text x="672" y="592" text-anchor="middle" class="t">Disable + strip</text><text x="672" y="616" text-anchor="middle" class="s">On-premises and cloud access</text>
  <rect x="820" y="565" width="245" height="65" rx="10" class="g"/><text x="942" y="592" text-anchor="middle" class="t">Grace, then daily sweep</text><text x="942" y="616" text-anchor="middle" class="s">Delete only a recorded disabled user</text>
  <line x1="280" y1="598" x2="325" y2="598" class="l"/><line x1="525" y1="598" x2="570" y2="598" class="l"/><line x1="770" y1="598" x2="815" y2="598" class="lg"/>
  <text x="580" y="704" text-anchor="middle" class="s">The directory owns the person. Vault carries the one-time secret. Synchronization creates the cloud object. Graph adds cloud-only access.</text>
  <g transform="translate(95 735)"><rect width="16" height="16" fill="#101a28" stroke="#00d4ff"/><text x="26" y="14" class="s">Cyan: directory or pipeline</text><rect x="270" width="16" height="16" fill="#1d1730" stroke="#bf8cff"/><text x="296" y="14" class="s">Purple: secrets or cloud assignment</text><rect x="610" width="16" height="16" fill="#10231d" stroke="#00ff96"/><text x="636" y="14" class="s">Green: usable or safely retired state</text></g>
</svg>
