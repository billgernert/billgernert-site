<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-label="Codex build lane creates a pull request, Claude reviews the branch, deterministic checks verify current state, and a separate executor merges"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.h{font:700 24px Arial;fill:#fff}.t{font:700 17px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#00ff96;stroke-width:2;fill:none;stroke-dasharray:7 6}</style></defs><rect width="1120" height="620" fill="#090e18"/><text x="50" y="52" class="h">The author, reviewer, policy checker and executor are separate</text><rect x="55" y="125" width="225" height="120" rx="12" class="n"/><text x="168" y="161" text-anchor="middle" class="t">Codex build lane</text><text x="168" y="190" text-anchor="middle" class="s">Implements one tasking</text><text x="168" y="216" text-anchor="middle" class="s">and opens a pull request</text><rect x="335" y="125" width="225" height="120" rx="12" class="w"/><text x="448" y="161" text-anchor="middle" class="t">Claude reviewer lane</text><text x="448" y="190" text-anchor="middle" class="s">Judges task intent, diff,</text><text x="448" y="216" text-anchor="middle" class="s">tests and failure paths</text><rect x="615" y="125" width="225" height="120" rx="12" class="g"/><text x="728" y="161" text-anchor="middle" class="t">Deterministic checks</text><text x="728" y="190" text-anchor="middle" class="s">Current commit, green CI,</text><text x="728" y="216" text-anchor="middle" class="s">scope, conflict and authority</text><rect x="895" y="125" width="170" height="120" rx="12" class="g"/><text x="980" y="161" text-anchor="middle" class="t">Merge executor</text><text x="980" y="190" text-anchor="middle" class="s">Acts after both</text><text x="980" y="216" text-anchor="middle" class="s">boundaries pass</text><line x1="280" y1="185" x2="330" y2="185" class="l"/><line x1="560" y1="185" x2="610" y2="185" class="l"/><line x1="840" y1="185" x2="890" y2="185" class="l"/><rect x="235" y="365" width="650" height="110" rx="12" fill="none" stroke="#37516c" stroke-width="2"/><text x="560" y="401" text-anchor="middle" class="t">The approval is tied to the reviewed head commit</text><text x="560" y="430" text-anchor="middle" class="s">A new commit, new conflict or changed check result invalidates stale eligibility.</text><text x="560" y="456" text-anchor="middle" class="s">Gitea is read again immediately before merge.</text><path d="M728 245V360" class="d"/><g transform="translate(60 555)"><rect width="16" height="16" fill="#101a28" stroke="#00d4ff"/><text x="26" y="14" class="s">Cyan: authored work</text><rect x="245" width="16" height="16" fill="#271f0e" stroke="#ffd166"/><text x="271" y="14" class="s">Amber: independent model judgment</text><rect x="580" width="16" height="16" fill="#10231d" stroke="#00ff96"/><text x="606" y="14" class="s">Green: deterministic policy or action</text></g></svg>
