<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img" aria-label="Layered AutomationLab architecture showing public edge, Kubernetes applications, shared identity and secrets, Proxmox compute, monitoring, and backup"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.h{font:700 25px Arial;fill:#fff}.t{font:700 17px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.band{fill:#0e1724;stroke:#37516c;stroke-width:2}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.p{fill:#1d1730;stroke:#bf8cff;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#00ff96;stroke-width:2;fill:none;stroke-dasharray:7 6}</style></defs><rect width="1200" height="980" fill="#090e18"/><text x="50" y="52" class="h">AutomationLab responsibility map</text><rect x="45" y="90" width="1110" height="135" rx="14" class="band"/><text x="70" y="120" class="t">Public edge and browser identity</text><rect x="90" y="145" width="220" height="55" rx="10" class="w"/><text x="200" y="179" text-anchor="middle" class="t">DNS + edge policy</text><rect x="390" y="145" width="220" height="55" rx="10" class="w"/><text x="500" y="179" text-anchor="middle" class="t">Entra sign-in + MFA</text><rect x="690" y="145" width="220" height="55" rx="10" class="w"/><text x="800" y="179" text-anchor="middle" class="t">Outbound tunnel</text><rect x="990" y="145" width="120" height="55" rx="10" class="w"/><text x="1050" y="179" text-anchor="middle" class="t">Internet</text><line x1="310" y1="173" x2="385" y2="173" class="l"/><line x1="610" y1="173" x2="685" y2="173" class="l"/><rect x="45" y="260" width="1110" height="185" rx="14" class="band"/><text x="70" y="291" class="t">Kubernetes application platform</text><rect x="90" y="325" width="180" height="80" rx="10" class="n"/><t