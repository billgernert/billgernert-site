<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-label="AI automation path from collected evidence through deterministic checks, local and paid models, operator approval and bounded action">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.h{font:700 25px Arial;fill:#fff}.t{font:700 16px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.r{fill:#28131a;stroke:#ff5c7a;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1160" height="720" fill="#090e18"/><text x="50" y="52" class="h">A model can explain and propose; controls decide whether anything reaches the lab</text>
  <rect x="45" y="110" width="215" height="125" rx="12" class="n"/><text x="153" y="146" text-anchor="middle" class="t">Collected evidence</text><text x="153" y="175" text-anchor="middle" class="s">Alerts, build state and backups</text><text x="153" y="199" text-anchor="middle" class="s">Read through scoped collectors</text><text x="153" y="223" text-anchor="middle" class="s">No model acts on raw access</text>
  <rect x="320" y="110" width="215" height="125" rx="12" class="n"/><text x="428" y="146" text-anchor="middle" class="t">Deterministic code</text><text x="428" y="175" text-anchor="middle" class="s">Groups known conditions</text><text x="428" y="199" text-anchor="middle" class="s">Rejects missing input</text><text x="428" y="223" text-anchor="middle" class="s">Keeps rules outside prompts</text>
  <rect x="595" y="110" width="215" height="125" rx="12" class="g"/><text x="703" y="146" text-anchor="middle" class="t">Local model first</text><text x="703" y="175" text-anchor="middle" class="s">Handles routine classification</text><text x="703" y="199" text-anchor="middle" class="s">No per-request provider cost</text><text x="703" y="223" text-anchor="middle" class="s">Hard cases continue</text>
  <rect x="870" y="110" width="245" height="125" rx="12" class="w"/><text x="993" y="146" text-anchor="middle" class="t">Paid model through gateway</text><text x="993" y="175" text-anchor="middle" class="s">App, key and global limits</text><text x="993" y="199" text-anchor="middle" class="s">Unreadable budget means deny</text><text x="993" y="223" text-anchor="middle" class="s">Gateway failure stays loud</text>
  <line x1="260" y1="173" x2="315" y2="173" class="l"/><line x1="535" y1="173" x2="590" y2="173" class="l"/><line x1="810" y1="173" x2="865" y2="173" class="l"/>
  <rect x="160" y="360" width="255" height="135" rx="14" class="n"/><text x="288" y="397" text-anchor="middle" class="t">Plan with evidence</text><text x="288" y="427" text-anchor="middle" class="s">Named target and exact action</text><text x="288" y="451" text-anchor="middle" class="s">Confidence never grants access</text><text x="288" y="475" text-anchor="middle" class="s">Unparseable output stops</text>
  <rect x="453" y="360" width="255" height="135" rx="14" class="w"/><text x="581" y="397" text-anchor="middle" class="t">Operator approval</text><text x="581" y="427" text-anchor="middle" class="s">Reviews the evidence and plan</text><text x="581" y="451" text-anchor="middle" class="s">Timeout or missing approval stops</text><text x="581" y="475" text-anchor="middle" class="s">No approval means no change</text>
  <rect x="746" y="360" width="255" height="135" rx="14" class="g"/><text x="874" y="397" text-anchor="middle" class="t">Bounded action + proof</text><text x="874" y="427" text-anchor="middle" class="s">One allowlisted operation</text><text x="874" y="451" text-anchor="middle" class="s">Protected identity systems excluded</text><text x="874" y="475" text-anchor="middle" class="s">Monitoring checks the result</text>
  <path d="M993 235C993 300 350 300 288 355" class="l"/><line x1="415" y1="427" x2="448" y2="427" class="l"/><line x1="708" y1="427" x2="741" y2="427" class="l"/>
  <rect x="225" y="560" width="710" height="78" rx="12" class="r"/><text x="580" y="591" text-anchor="middle" class="t">The model has no direct route to infrastructure credentials or unrestricted execution</text><text x="580" y="619" text-anchor="middle" class="s">The gateway limits spend; the tool layer limits reach; the operator controls the change; monitoring checks the outcome.</text>
  <g transform="translate(170 678)"><rect width="16" height="16" fill="#101a28" stroke="#00d4ff"/><text x="26" y="14" class="s">Cyan: deterministic automation</text><rect x="285" width="16" height="16" fill="#271f0e" stroke="#ffd166"/><text x="311" y="14" class="s">Amber: cost or approval gate</text><rect x="605" width="16" height="16" fill="#10231d" stroke="#00ff96"/><text x="631" y="14" class="s">Green: bounded execution</text></g>
</svg>
