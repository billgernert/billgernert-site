<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 730" role="img" aria-label="A Windows server joins the directory, receives policy and certificates, enforces Duo on remote desktop, and is managed through an interim runner while Kerberos over HTTPS is rolled out">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.h{font:700 25px Arial;fill:#fff}.t{font:700 16px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.r{fill:#28131a;stroke:#ff5c7a;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#ffd166;stroke-width:2;fill:none;stroke-dasharray:7 6}</style></defs>
  <rect width="1160" height="730" fill="#090e18"/><text x="50" y="52" class="h">A joined Windows server receives trust, access policy and managed configuration</text>
  <rect x="55" y="105" width="235" height="125" rx="12" class="w"/><text x="172" y="142" text-anchor="middle" class="t">Provisioning pipeline</text><text x="172" y="172" text-anchor="middle" class="s">Creates and configures the VM</text><text x="172" y="197" text-anchor="middle" class="s">then joins the directory</text>
  <rect x="455" y="100" width="250" height="135" rx="14" class="g"/><text x="580" y="138" text-anchor="middle" class="t">Domain-joined server</text><text x="580" y="169" text-anchor="middle" class="s">Machine identity</text><text x="580" y="194" text-anchor="middle" class="s">Policy target</text><text x="580" y="219" text-anchor="middle" class="s">Certificate consumer</text>
  <line x1="290" y1="167" x2="450" y2="167" class="l"/>
  <rect x="835" y="85" width="270" height="95" rx="12" class="n"/><text x="970" y="120" text-anchor="middle" class="t">Directory + Group Policy</text><text x="970" y="149" text-anchor="middle" class="s">Machine trust, drive maps, banner</text><text x="970" y="172" text-anchor="middle" class="s">and certificate auto-enrollment</text>
  <rect x="835" y="215" width="270" height="95" rx="12" class="n"/><text x="970" y="250" text-anchor="middle" class="t">Internal certificate authority</text><text x="970" y="279" text-anchor="middle" class="s">Issues from an approved template</text><text x="970" y="302" text-anchor="middle" class="s">to an authorized machine</text>
  <rect x="835" y="345" width="270" height="95" rx="12" class="n"/><text x="970" y="380" text-anchor="middle" class="t">Duo on remote desktop</text><text x="970" y="409" text-anchor="middle" class="s">Password is followed by MFA</text><text x="970" y="432" text-anchor="middle" class="s">Current outage behavior is fail-open</text>
  <path d="M705 145C755 145 780 135 830 135" class="l"/><path d="M705 170C765 195 780 250 830 260" class="l"/><path d="M705 195C765 250 780 370 830 390" class="l"/>
  <rect x="55" y="365" width="650" height="210" rx="14" fill="none" stroke="#37516c" stroke-width="2"/><text x="80" y="400" class="t">Remote automation is midway through a safer transport migration</text>
  <rect x="90" y="445" width="240" height="90" rx="12" class="w"/><text x="210" y="478" text-anchor="middle" class="t">Interim path works</text><text x="210" y="507" text-anchor="middle" class="s">Dedicated compatible runner</text><text x="210" y="530" text-anchor="middle" class="s">for the existing Windows channel</text>
  <rect x="430" y="445" width="240" height="90" rx="12" class="g"/><text x="550" y="478" text-anchor="middle" class="t">Durable path selected</text><text x="550" y="507" text-anchor="middle" class="s">Kerberos authentication</text><text x="550" y="530" text-anchor="middle" class="s">over WinRM HTTPS</text>
  <line x1="330" y1="490" x2="425" y2="490" class="l"/>
  <rect x="235" y="610" width="690" height="60" rx="10" class="r"/><text x="580" y="637" text-anchor="middle" class="t">Still owed: second-controller proof, fleet cutover and a durable policy grant</text><text x="580" y="660" text-anchor="middle" class="s">The staged Kerberos configuration is not described as complete until those checks pass.</text>
  <text x="580" y="706" text-anchor="middle" class="s">The server is already managed. The remaining work replaces the compatibility bridge without losing the working path.</text>
</svg>
