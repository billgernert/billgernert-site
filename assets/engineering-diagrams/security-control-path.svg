<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 590" role="img" aria-label="Security decisions from identity through pipeline policy and workload credentials to the target system"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.h{font:700 24px Arial;fill:#fff}.t{font:700 17px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.r{fill:#28131a;stroke:#ff5c7a;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;marker-end:url(#a)}.d{stroke:#00ff96;stroke-width:2;stroke-dasharray:7 6;fill:none}</style></defs><rect width="1100" height="590" fill="#090e18"/><text x="50" y="52" class="h">One request, four security decisions, one evidence path</text><rect x="45" y="120" width="210" height="125" rx="12" class="n"/><text x="150" y="155" text-anchor="middle" class="t">1. Edge identity</text><text x="150" y="184" text-anchor="middle" class="s">Sign-in, MFA and group</text><text x="150" y="208" text-anchor="middle" class="s">before application traffic</text><rect x="305" y="120" width="210" height="125" rx="12" class="g"/><text x="410" y="155" text-anchor="middle" class="t">2. Pipeline gate</text><text x="410" y="184" text-anchor="middle" class="s">Request, approval, plan,</text><text x="410" y="208" text-anchor="middle" class="s">budget and known state</text><rect x="565" y="120" width="210" height="125" rx="12" class="n"/><text x="670" y="155" text-anchor="middle" class="t">3. Vault role</text><text x="670" y="184" text-anchor="middle" class="s">One workload reads one</text><text x="670" y="208" text-anchor="middle" class="s">registered credential scope</text><rect x="825" y="120" width="230" height="125" rx="12" class="g"/><text x="940" y="155" text-anchor="middle" class="t">4. Target permission</text><text x="940" y="184" text-anchor="middle" class="s">Provider or operating system</text><text x="940" y="208" text-anchor="middle" class="s">authorizes the exact action</text><line x1="255" y1="182" x2="300" y2="182" class="l"/><line x1="515" y1="182" x2="560" y2="182" class="l"/><line x1="775" y1="182" x2="820" y2="182" class="l"/><rect x="165" y="335" width="770" height="115" rx="12" class="n"/><text x="550" y="370" text-anchor="middle" class="t">Independent evidence after the change</text><text x="550" y="400" text-anchor="middle" class="s">CI result · audit record · live login or API request · served certificate · monitoring state</text><text x="550" y="425" text-anchor="middle" class="s">The process that wrote the change does not get the last word on whether the consumer works.</text><path d="M940 245V300Q940 322 915 335" class="d"/><rect x="420" y="475" width="260" height="55" rx="10" class="r"/><text x="550" y="509" text-anchor="middle" class="t">Unknown at any required gate = stop</text><g transform="translate(55 555)"><rect width="16" height="16" fill="#101a28" stroke="#00d4ff"/><text x="26" y="14" class="s">Cyan: identity, secret or evidence</text><rect x="360" width="16" height="16" fill="#10231d" stroke="#00ff96"/><text x="386" y="14" class="s">Green: enforced decision</text><rect x="650" width="16" height="16" fill="#28131a" stroke="#ff5c7a"/><text x="676" y="14" class="s">Red: denied or unknown state</text></g></svg>
