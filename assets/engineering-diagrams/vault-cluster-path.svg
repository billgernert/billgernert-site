<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-label="Vault request path through a shared address to three Raft nodes, with Transit auto-unseal and monitoring"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.t{font:700 17px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#00ff96;stroke-width:2;fill:none;stroke-dasharray:7 6}.h{font:700 24px Arial;fill:#fff}</style></defs><rect width="1100" height="620" fill="#090e18"/><text x="50" y="52" class="h">How a Vault request survives one failed node</text><rect x="50" y="110" width="190" height="95" rx="12" class="n"/><text x="145" y="145" text-anchor="middle" class="t">Pipeline or service</text><text x="145" y="172" text-anchor="middle" class="s">Narrow Vault identity</text><rect x="320" y="110" width="200" height="95" rx="12" class="n"/><text x="420" y="145" text-anchor="middle" class="t">Shared address</text><text x="420" y="172" text-anchor="middle" class="s">Owned by healthy node</text><path d="M240 158H315" class="l"/><rect x="640" y="80" width="390" height="260" rx="14" fill="none" stroke="#37516c" stroke-width="2"/><text x="665" y="112" class="t">Raft voting cluster</text><rect x="680" y="145" width="145" height="115" rx="10" class="g"/><text x="752" y="180" text-anchor="middle" class="t">Active node</text><text x="752" y="205" text-anchor="middle" class="s">Accepts request</text><text x="752" y="228" text-anchor="middle" class="s">Proposes log entry</text><rect x="850" y="145" width="145" height="72" rx="10" class="n"/><text x="922" y="177" text-anchor="middle" class="t">Peer</text><text x="922" y="199" text-anchor="middle" class="s">Records log</text><rect x="850" y="238" width="145" height="72" rx="10" class="n"/><text x="922" y="270" text-anchor="middle" class="t">Peer</text><text x="922" y="292" text-anchor="middle" class="s">Records log</text><path d="M520 158H675" class="l"/><path d="M825 180H845" class="l"/><path d="M825 228L845 260" class="l"/><rect x="80" y="390" width="260" height="115" rx="12" class="w"/><text x="210" y="425" text-anchor="middle" class="t">Transit auto-unseal</text><text x="210" y="452" text-anchor="middle" class="s">Separate encryption service</text><text x="210" y="477" text-anchor="middle" class="s">Cluster key never stored here</text><path d="M340 445C500 445 600 335 700 260" class="d"/><rect x="440" y="390" width="260" height="115" rx="12" class="g"/><text x="570" y="425" text-anchor="middle" class="t">Local health checks</text><text x="570" y="452" text-anchor="middle" class="s">Sealed or unavailable node</text><text x="570" y="477" text-anchor="middle" class="s">surrenders shared address</text><path d="M570 390V210" class="d"/><rect x="790" y="390" width="240" height="115" rx="12" class="n"/><text x="910" y="425" text-anchor="middle" class="t">Prometheus</text><text x="910" y="452" text-anchor="middle" class="s">Service, seal, TLS,</text><text x="910" y="477" text-anchor="middle" class="s">quorum and coverage</text><path d="M790 445H705" class="d"/><g transform="translate(50 545)"><rect width="16" height="16" fill="#101a28" stroke="#00d4ff"/><text x="26" y="14" class="s">Cyan: request or monitored service</text><rect x="310" width="16" height="16" fill="#10231d" stroke="#00ff96"/><text x="336" y="14" class="s">Green: health or active majority</text><rect x="605" width="16" height="16" fill="#271f0e" stroke="#ffd166"/><text x="631" y="14" class="s">Amber: separate trust dependency</text></g></svg>
