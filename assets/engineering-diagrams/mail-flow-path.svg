<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 760" role="img" aria-label="Inbound, outbound, client, and webmail flows through a cloud relay and private mailbox backend"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00ff96"/></marker><style>.h{font:700 24px Arial;fill:#fff}.t{font:700 17px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}.o{stroke:#00ff96;stroke-width:3;fill:none;marker-end:url(#b)}.d{stroke:#ffd166;stroke-width:2;fill:none;stroke-dasharray:7 6}</style></defs><rect width="1150" height="760" fill="#090e18"/><text x="50" y="52" class="h">Four mail paths share one edge and one mailbox store</text><rect x="45" y="110" width="190" height="95" rx="12" class="n"/><text x="140" y="145" text-anchor="middle" class="t">Internet sender</text><text x="140" y="174" text-anchor="middle" class="s">Looks up MX</text><rect x="310" y="90" width="250" height="180" rx="14" class="w"/><text x="435" y="125" text-anchor="middle" class="t">Cloud edge relay</text><text x="435" y="154" text-anchor="middle" class="s">Postscreen + Postfix</text><text x="435" y="179" text-anchor="middle" class="s">TLS passthrough for clients</text><text x="435" y="204" text-anchor="middle" class="s">Stable outbound address</text><text x="435" y="234" text-anchor="middle" class="s">No mailbox storage</text><rect x="665" y="90" width="285" height="180" rx="14" class="g"/><text x="808" y="125" text-anchor="middle" class="t">Private mailbox backend</text><text x="808" y="154" text-anchor="middle" class="s">Postfix + Dovecot</text><text x="808" y="179" text-anchor="middle" class="s">Amavis content filter</text><text x="808" y="204" text-anchor="middle" class="s">Mailboxes + submission</text><text x="808" y="234" text-anchor="middle" class="s">Roundcube webmail</text><path d="M235 157H305" class="l"/><path d="M560 157H660" class="l"/><text x="610" y="143" text-anchor="middle" class="s">private mesh</text><rect x="45" y="345" width="190" height="95" rx="12" class="n"/><text x="140" y="380" text-anchor="middle" class="t">Mail client</text><text x="140" y="409" text-anchor="middle" class="s">IMAP + submission</text><path d="M235 392C360 392 570 290 665 225" class="l"/><text x="430" y="350" text-anchor="middle" class="s">encrypted TLS passthrough</text><rect x="45" y="510" width="190" height="95" rx="12" class="n"/><text x="140" y="545" text-anchor="middle" class="t">Web browser</text><text x="140" y="574" text-anchor="middle" class="s">Entra sign-in</text><rect x="310" y="510" width="250" height="95" rx="12" class="n"/><text x="435" y="545" text-anchor="middle" class="t">Identity-protected tunnel</text><text x="435" y="574" text-anchor="middle" class="s">Approved request to Roundcube</text><path d="M235 558H305" class="l"/><path d="M560 558C650 558 730 350 780 270" class="l"/><rect x="920" y="345" width="190" height="95" rx="12" class="n"/><text x="1015" y="380" text-anchor="middle" class="t">Directory</text><text x="1015" y="409" text-anchor="middle" class="s">LDAPS mailbox identity</text><path d="M950 270C975 300 990 320 1000 340" class="d"/><rect x="920" y="510" width="190" height="95" rx="12" class="n"/><text x="1015" y="545" text-anchor="middle" class="t">Delivery provider</text><text x="1015" y="574" text-anchor="middle" class="s">Internet outbound route</text><path d="M808 270C760 450 590 500 520 270" class="o"/><text x="685" y="465" text-anchor="middle" class="s">outbound returns through edge</text><path d="M560 235C730 390 880 480 915 540" class="o"/><g transform="translate(55 680)"><rect width="16" height="16" fill="#101a28" stroke="#00d4ff"/><text x="26" y="14" class="s">Cyan: inbound, client or identity path</text><rect x="340" width="16" height="16" fill="#10231d" stroke="#00ff96"/><text x="366" y="14" class="s">Green: private mailbox and outbound path</text><rect x="710" width="16" height="16" fill="#271f0e" stroke="#ffd166"/><text x="736" y="14" class="s">Amber: public relay boundary</text></g></svg>
