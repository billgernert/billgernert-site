<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 680" role="img" aria-label="Internal monitoring data is reduced by recording rules before a separate public Prometheus and Grafana serve dashboards"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.h{font:700 24px Arial;fill:#fff}.t{font:700 17px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.r{fill:#28131a;stroke:#ff5c7a;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#00ff96;stroke-width:2;fill:none;stroke-dasharray:7 6}</style></defs><rect width="1160" height="680" fill="#090e18"/><text x="50" y="52" class="h">The public privacy boundary sits before Grafana</text><rect x="45" y="115" width="190" height="125" rx="12" class="n"/><text x="140" y="151" text-anchor="middle" class="t">Exporters</text><text x="140" y="180" text-anchor="middle" class="s">Full operational labels</text><text x="140" y="204" text-anchor="middle" class="s">and target identity</text><rect x="280" y="115" width="205" height="125" rx="12" class="n"/><text x="382" y="151" text-anchor="middle" class="t">Private Prometheus</text><text x="382" y="180" text-anchor="middle" class="s">Operator metrics, alerts</text><text x="382" y="204" text-anchor="middle" class="s">and troubleshooting detail</text><rect x="530" y="115" width="205" height="125" rx="12" class="g"/><text x="632" y="151" text-anchor="middle" class="t">Recording rules</text><text x="632" y="180" text-anchor="middle" class="s">Select, aggregate, relabel</text><text x="632" y="204" text-anchor="middle" class="s">and drop identifiers</text><rect x="780" y="115" width="170" height="125" rx="12" class="w"/><text x="865" y="151" text-anchor="middle" class="t">Public Prometheus</text><text x="865" y="180" text-anchor="middle" class="s">Reduced series</text><text x="865" y="204" text-anchor="middle" class="s">stable service classes</text><rect x="995" y="115" width="130" height="125" rx="12" class="w"/><text x="1060" y="151" text-anchor="middle" class="t">Public Grafana</text><text x="1060" y="180" text-anchor="middle" class="s">Fixed queries</text><text x="1060" y="204" text-anchor="middle" class="s">read-only views</text><line x1="235" y1="178" x2="275" y2="178" class="l"/><line x1="485" y1="178" x2="525" y2="178" class="l"/><line x1="735" y1="178" x2="775" y2="178" class="l"/><line x1="950" y1="178" x2="990" y2="178" class="l"/><rect x="170" y="370" width="300" height="120" rx="12" class="r"/><text x="320" y="407" text-anchor="middle" class="t">Labels removed at the boundary</text><text x="320" y="436" text-anchor="middle" class="s">Addresses, host and guest identity, pods,</text><text x="320" y="460" text-anchor="middle" class="s">namespaces, alert text and management links</text><path d="M575 240C540 305 430 320 390 365" class="d"/><rect x="650" y="370" width="340" height="120" rx="12" class="g"/><text x="820" y="407" text-anchor="middle" class="t">Generated dashboard contract</text><text x="820" y="436" text-anchor="middle" class="s">Approved queries, state rules, drill-down routes</text><text x="820" y="460" text-anchor="middle" class="s">and no-data-never-green behavior</text><path d="M865 240C860 300 840 325 825 365" class="d"/><rect x="385" y="545" width="390" height="70" rx="12" class="n"/><text x="580" y="576" text-anchor="middle" class="t">Nightly reconciler compares live Grafana with generated intent</text><text x="580" y="600" text-anchor="middle" class="s">Its own heartbeat is monitored.</text><path d="M820 490C770 525 700 535 650 545" class="d"/><g transform="translate(55 650)"><rect width="16" height="16" fill="#101a28" stroke="#00d4ff"/><text x="26" y="14" class="s">Cyan: internal data or reconciliation</text><rect x="330" width="16" height="16" fill="#10231d" stroke="#00ff96"/><text x="356" y="14" class="s">Green: enforced public contract</text><rect x="635" width="16" height="16" fill="#271f0e" stroke="#ffd166"/><text x="661" y="14" class="s">Amber: public data and dashboard</text></g></svg>
