<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 870" role="img" aria-label="How the NOC reaches your browser">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker></defs>
<rect x="1" y="1" width="898" height="868" rx="12" fill="#090e18" stroke="#263d50"/>
<text x="40" y="43" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#fff">How the NOC reaches your browser</text>
<rect x="40" y="90" width="820" height="130" rx="10" fill="#101d2b" stroke="#00d4ff" stroke-width="2"/>
<text x="58" y="122" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">Monitoring containers and database</text>
<text x="58" y="149" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#c9d3e5">Exporters and Prometheus produce approved series. Database views support</text>
<text x="58" y="177" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#c9d3e5">fixed SQL panels.</text>
<path d="M450.0 222V250" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="255" width="820" height="130" rx="10" fill="#101d2b" stroke="#00d4ff" stroke-width="2"/>
<text x="58" y="287" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">Grafana container + sidecars</text>
<text x="58" y="314" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#c9d3e5">Provisioned shared dashboards select reviewed public measurements with</text>
<text x="58" y="342" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#c9d3e5">saved queries.</text>
<path d="M450.0 387V415" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="420" width="820" height="130" rx="10" fill="#101d2b" stroke="#00d4ff" stroke-width="2"/>
<text x="58" y="452" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">Cloudflare request and response boundary</text>
<text x="58" y="479" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#c9d3e5">Access policies restrict paths. The Worker filters complete dashboard</text>
<text x="58" y="507" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#c9d3e5">responses.</text>
<path d="M450.0 552V580" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="585" width="820" height="130" rx="10" fill="#101d2b" stroke="#00d4ff" stroke-width="2"/>
<text x="58" y="617" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">Portfolio and browser</text>
<text x="58" y="644" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#c9d3e5">A domain tile opens its curated dashboard. Missing measurements stay</text>
<text x="58" y="672" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#c9d3e5">visible as no signal.</text>
<rect x="40" y="736" width="15" height="15" fill="#00d4ff"/>
<text x="66" y="749" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#c9d3e5">Cyan. Data processing and delivery.</text>
<rect x="40" y="766" width="19" height="14" rx="3" fill="none" stroke="#00d4ff"/>
<text x="66" y="779" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#c9d3e5">Rounded box. Service or process.</text>
<path d="M40 803h19" stroke="#00d4ff" stroke-width="2" marker-end="url(#arrow)"/>
<text x="66" y="809" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#c9d3e5">Arrow. Direction of data.</text>
</svg>
