<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" role="img" aria-label="Digest jobs write completion rows, an in-cluster sender pushes age to Zabbix, and Prometheus independently watches Zabbix"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5 0 10z" fill="#00d4ff"/></marker><style>.h{font:700 24px Arial;fill:#fff}.t{font:700 17px Arial;fill:#eef4fb}.s{font:14px Arial;fill:#aebbd0}.n{fill:#101a28;stroke:#00d4ff;stroke-width:2}.g{fill:#10231d;stroke:#00ff96;stroke-width:2}.w{fill:#271f0e;stroke:#ffd166;stroke-width:2}.l{stroke:#00d4ff;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke:#00ff96;stroke-width:2;fill:none;stroke-dasharray:7 6}</style></defs><rect width="1100" height="650" fill="#090e18"/><text x="50" y="52" class="h">How silence becomes two different alarms</text><rect x="45" y="110" width="190" height="105" rx="12" class="n"/><text x="140" y="145" text-anchor="middle" class="t">Daily digest</text><text x="140" y="173" text-anchor="middle" class="s">Sends report</text><text x="140" y="197" text-anchor="middle" class="s">Writes completion row</text><rect x="295" y="110" width="200" height="105" rx="12" class="n"/><text x="395" y="145" text-anchor="middle" class="t">Private database</text><text x="395" y="173" text-anchor="middle" class="s">Last successful send</text><text x="395" y="197" text-anchor="middle" class="s">stays inside cluster</text><rect x="555" y="110" width="210" height="105" rx="12" class="g"/><text x="660" y="145" text-anchor="middle" class="t">Heartbeat sender</text><text x="660" y="173" text-anchor="middle" class="s">Runs about every 15 min</text><text x="660" y="197" text-anchor="middle" class="s">Calculates age in hours</text><rect x="825" y="110" width="225" height="105" rx="12" class="n"/><text x="938" y="145" text-anchor="middle" class="t">Zabbix trapper items</text><text x="938" y="173" text-anchor="middle" class="s">Receive age values</text><text x="938" y="197" text-anchor="middle" class="s">No database credential</text><path d="M235 162H290" class="l"/><path d="M495 162H550" class="l"/><path d="M765 162H820" class="l"/><rect x="215" y="315" width="285" height="115" rx="12" class="w"/><text x="357" y="352" text-anchor="middle" class="t">Age threshold alarm</text><text x="357" y="381" text-anchor="middle" class="s">Fresh pushes report an old</text><text x="357" y="405" text-anchor="middle" class="s">digest completion</text><rect x="600" y="315" width="285" height="115" rx="12" class="w"/><text x="742" y="352" text-anchor="middle" class="t">No-data alarm</text><text x="742" y="381" text-anchor="middle" class="s">The sender stopped updating</text><text x="742" y="405" text-anchor="middle" class="s">the receiving item</text><path d="M900 215C820 270 560 270 430 315" class="l"/><path d="M960 215C960 270 850 285 790 315" class="l"/><rect x="350" y="485" width="400" height="90" rx="12" class="g"/><text x="550" y="520" text-anchor="middle" class="t">Prometheus watches the Zabbix virtual machine</text><text x="550" y="548" text-anchor="middle" class="s">A separate monitoring plane reports when Zabbix itself disappears.</text><path d="M550 485C700 445 860 430 930 215" class="d"/><g transform="translate(55 615)"><rect width="16" height="16" fill="#101a28" stroke="#00d4ff"/><text x="26" y="14" class="s">Cyan: data or receiving service</text><rect x="330" width="16" height="16" fill="#10231d" stroke="#00ff96"/><text x="356" y="14" class="s">Green: independent checker</text><rect x="625" width="16" height="16" fill="#271f0e" stroke="#ffd166"/><text x="651" y="14" class="s">Amber: alert condition</text></g></svg>
